    <!-- Installable web app (PWA): Safari's "Add to Home Screen" gives
         the app its own icon and a full-screen, standalone launch.
         The file-referencing <link>s (manifest, touch icon, favicon)
         are injected into the built HTML by build-static.mjs —
         Bun resolves relative link hrefs as bundle assets, so they
         cannot live in this source file. The files themselves live
         in client/public/ and ship verbatim at the site root. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!-- Persian/Arabic-script font, SELF-HOSTED (no CDN):
         Vazirmatn woff2 files live in client/public/fonts/ and
         ship verbatim at ./fonts/. Every element marked
         lang="fa" (tap-a-word glosses, flashcard meanings,
         Persian grammar explanations) or lang="ar" (Arabic
         translations from the global language picker) renders
         in Vazirmatn; Latin/French text keeps its own fonts.
         Line-height is generous: the script needs it. -->
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("./assets/fonts/vazirmatn-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("./assets/fonts/vazirmatn-bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      [lang="fa"],
      [lang="ar"] {
        font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
        line-height: 2;
      }
      /* Latin font, SELF-HOSTED (no CDN): Nunito variable woff2
         (weights 400–800 in one file), the rounded geometric sans
         of the Lingua-style theme. The font-family itself is
         applied in theme.css. */
      @font-face {
        font-family: "Nunito";
        src: url("./assets/fonts/nunito.woff2") format("woff2");
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }
      /* Rounded display font, SELF-HOSTED: Fredoka variable
         ttf (weights 300–700) in client/public/fonts/,
         shipped like Nunito's. Used by the Home v6 screen
         (bar counter, level title, star chip, Continue)
         and already named by the Bubble Dream stack. */
      @font-face {
        font-family: "Fredoka";
        src: url("./assets/fonts/fredoka.ttf") format("truetype");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
      /* Chunky display font for outlined numbers,
         SELF-HOSTED: Lilita One (Google Fonts, OFL) in
         client/public/fonts/, shipped like Fredoka's.
         Used by the Contest page (Asra's design package,
         Nov 8, 2026) for its outlined score numerals. */
      @font-face {
        font-family: "Lilita One";
        src: url("./assets/fonts/lilita-one.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Serif display font, SELF-HOSTED: Libre Baskerville
         variable woff2 (weights 400–700 in one file) in
         client/public/fonts/, shipped like Nunito's. Used by
         the Vocabulary (Flashcards) Tracker screen — the
         serif of Asra's design package (Nov 8, 2026). */
      @font-face {
        font-family: "Libre Baskerville";
        src: url("./assets/fonts/libre-baskerville.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      /* Serif display font, SELF-HOSTED: Fraunces (latin
         subsets, weights 600/700 + italics 500/600) in
         client/public/fonts/, shipped like Nunito's. Used
         by the Writing and Practice Tracker screens — the
         serif of Asra's design packages (Nov 8, 2026). */
      @font-face {
        font-family: "Fraunces";
        src: url("./assets/fonts/fraunces-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("./assets/fonts/fraunces-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("./assets/fonts/fraunces-500-italic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("./assets/fonts/fraunces-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
        font-display: swap;
      }
      /* Script font, SELF-HOSTED: Great Vibes (latin) in
         client/public/fonts/. Used inside the Writing
         Tracker's stamp artwork (« Bonjour », « Carte
         postale ») — the script of Asra's package. */
      @font-face {
        font-family: "Great Vibes";
        src: url("./assets/fonts/great-vibes.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- Dark mode (Nov 7, 2026): apply the saved choice
         (Settings → « Dark mode », origb1:dark-mode)
         BEFORE first paint, so a dark-mode learner never
         sees a light flash. Default = light. The
         useDarkMode hook in App.tsx keeps this attribute
         in sync afterwards. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          window.localStorage.getItem("origb1:dark-mode") === "1"
            ? "dark"
            : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <!-- Boot scrub (Nov 12, 2026): runs BEFORE the app bundle
         is even fetched, so it survives a device whose stored
         state kills the bundle during module init — the case
         the in-bundle healStoredState (main.tsx) can never
         reach. Two jobs, both structural and idempotent:
         (1) This app has NEVER registered a service worker;
             if one is somehow registered for this origin,
             unregister it and drop every Cache Storage cache,
             so the page always comes from the network, never
             from a trapped copy. (2) Validate the handful of
             BOOKKEEPING keys startup reads first (language,
             nav position, theme) and drop a value that is
             structurally impossible; progress keys are NOT
             touched here — healStoredState owns those, and
             /rescue owns the manual repair. The transient
             sign-in markers (auth-error, redirect-attempt)
             are dropped unconditionally: a stale one can
             only mislead the next load. Everything is wrapped
             so a failure here can never block the app. -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (r) {
                  r.unregister();
                });
              })
              .catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches
              .keys()
              .then(function (names) {
                names.forEach(function (n) {
                  caches.delete(n);
                });
              })
              .catch(function () {});
          }
        } catch (e) {}
        try {
          var ls = window.localStorage;
          ls.removeItem("origb1:auth-error");
          ls.removeItem("origb1:redirect-attempt");
          var lang = ls.getItem("origb1:lang");
          if (
            lang !== null &&
            ["en", "fa", "es", "ru", "hi", "ar"].indexOf(lang) === -1
          ) {
            ls.removeItem("origb1:lang");
          }
          var dm = ls.getItem("origb1:dark-mode");
          if (dm !== null && dm !== "0" && dm !== "1") {
            ls.removeItem("origb1:dark-mode");
          }
          var nav = ls.getItem("origb1:nav");
          if (nav !== null) {
            var ok = false;
            try {
              var parsed = JSON.parse(nav);
              ok =
                parsed !== null &&
                typeof parsed === "object" &&
                !Array.isArray(parsed);
            } catch (e2) {
              ok = false;
            }
            if (!ok) ls.removeItem("origb1:nav");
          }
          /* Reading checks: an array of {checkKey, …} entries.
             A non-array value is dropped outright; entries
             without a string checkKey are unusable to every
             reader and are filtered — the one malformation
             class the in-bundle healing used to leave behind. */
          var checks = ls.getItem("origb1:reading-checks");
          if (checks !== null) {
            try {
              var arr = JSON.parse(checks);
              if (!Array.isArray(arr)) {
                ls.removeItem("origb1:reading-checks");
              } else {
                var kept = arr.filter(function (c) {
                  return (
                    c !== null &&
                    typeof c === "object" &&
                    typeof c.checkKey === "string" &&
                    /* Real check keys are always « kind:… »
                       (visual:, game:, words:, listen:, sp:…). */
                    c.checkKey.indexOf(":") !== -1
                  );
                });
                if (kept.length !== arr.length) {
                  ls.setItem(
                    "origb1:reading-checks",
                    JSON.stringify(kept),
                  );
                }
              }
            } catch (e3) {
              ls.removeItem("origb1:reading-checks");
            }
          }
        } catch (e) {}
      })();
    </script>
