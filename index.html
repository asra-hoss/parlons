        + '<span class="qi" data-q="vocab">' + svg('<path d="M12 6c-2-1.5-4.5-2-8-2v14c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2V4c-3.5 0-6 .5-8 2z"/><path d="M12 6v14"/>', '#7a5ff0', 25) + '<span><span class="t" style="display:block">Vocabulary</span><span class="s" style="display:block">Learn new words</span></span></span>'
        + '<span class="qi" data-q="grammar">' + svg('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>', '#f08c4a', 25) + '<span><span class="t" style="display:block">Grammar</span><span class="s" style="display:block">Build your skills</span></span></span>'
        + '<span class="qi" data-q="practice">' + svg('<path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/>', '#43b581', 25) + '<span><span class="t" style="display:block">Practice</span><span class="s" style="display:block">Try exercises</span></span></span>'
        + '<span class="qi" data-q="progress">' + svg('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>', '#ef6aa5', 25) + '<span><span class="t" style="display:block">My Progress</span><span class="s" style="display:block">See your growth</span></span></span></div>';
      Array.prototype.forEach.call(main.children, function (c) { c.style.display = 'none'; });
      main.appendChild(wrap);
      main.style.position = 'relative';
      if (aside) aside.style.display = 'none';
      Array.prototype.forEach.call(shell.querySelectorAll('.overflow-y-auto'), function (el) {
        if (el !== main && el.textContent.indexOf('Weekly contest') >= 0) el.style.display = 'none';
      });
      var all = wrap.querySelector('#dz2-all');
      if (all) all.addEventListener('click', function () { clickNav('My lessons'); });
      Array.prototype.forEach.call(wrap.querySelectorAll('.dz2-lcard'), function (c) {
        c.addEventListener('click', function () {
          if (+c.getAttribute('data-dos') === curDosNum - 1 && contBtn) contBtn.click();
          else clickNav('My lessons');
        });
      });
      Array.prototype.forEach.call(wrap.querySelectorAll('.qi'), function (q) {
        q.addEventListener('click', function () {
          var k = q.getAttribute('data-q');
          if (k === 'vocab') clickTile('Vocab');
          else if (k === 'grammar') clickTile('Grammar');
          else if (k === 'practice') clickTile('Practice', 'Exercises');
          else if (k === 'progress') clickNav('Roadmap');
        });
      });
    });
  }
  var pending = false;
  function schedule() { if (pending) return; pending = true; setTimeout(function () { pending = false; build(); }, 400); }
  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
  schedule();
})();

</script>

<script id="chichilang-progress-collection">
/* Progress tab -> Collection page (Nov 27, 2026, Asra's instruction).
   The old Progress stays untouched in the app; removing this script restores it.
   Backup of the pre-change shell: /progress-copy/home-with-old-progress.html */
(function(){
  document.addEventListener('click', function(e){
    var t = e.target;
    if(!t || t.nodeType !== 1) return;
    var el = t.closest ? t.closest('button,a,[role="button"],div,span') : null;
    var hops = 0;
    while(el && hops < 6){
      var txt = (el.textContent || '').trim();
      if(txt === 'Progress'){
        /* only the bottom nav: its bar also holds Roadmap/Home */
        var bar = el.parentElement, bhops = 0;
        while(bar && bhops < 5){
          var bt = bar.textContent || '';
          if(bt.indexOf('Roadmap') > -1 && bt.indexOf('Home') > -1){
            e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
            location.href = '/progress-copy/collection-app.html?v=4';
            return;
          }
          bar = bar.parentElement; bhops++;
        }
      }
      el = el.parentElement; hops++;
    }
  }, true);
})();
</script>


<script id="chichilang-logo-names">
(function(){
var HIDE_EXACT=['Welcome back','Your French is waiting for you.','New accounts are created automatically.'];
function hideLoginExtras(){
  var els=document.querySelectorAll('p,h1,h2,h3,h4,div,span');
  for(var i=0;i<els.length;i++){var el=els[i];if(el.children.length)continue;var t=(el.textContent||'').trim();
    if(HIDE_EXACT.indexOf(t)>=0||t.indexOf('If you signed up with Google')===0)el.style.display='none';}
}
function fix(){
  hideLoginExtras();
  var pw=document.querySelectorAll('input[type="password"]');
  for(var j=0;j<pw.length;j++){if(pw[j].getAttribute('placeholder'))pw[j].setAttribute('placeholder','');}
  var imgs=document.querySelectorAll('img');
  for(var i=0;i<imgs.length;i++){var s=imgs[i].getAttribute('src')||'';if(s.indexOf('chichilang-mark-20261123.png')>=0)imgs[i].src=s.replace('chichilang-mark-20261123.png','chichilang-mark-clear.png');}
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var n;
  while(n=w.nextNode()){var t=n.nodeValue;var tr=t.trim();
    if(tr==='Parlons fran\u00e7ais'||tr==='\u2014 Parlons fran\u00e7ais')n.nodeValue=t.replace('Parlons fran\u00e7ais','Chichilang');
    else if(t.indexOf('48 dossiers')>=0)n.nodeValue=t.replace('48 dossiers','75 dossiers');}
}
function go(){fix();new MutationObserver(function(){fix();}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>

<script id="chichilang-nav-go">

function tryClick(){if(done)return;var b=document.querySelector('nav[aria-label="App"] button[aria-label="'+label+'"]');if(!b)return;if(b.getAttribute('aria-current')==='page'){done=true;return;}b.click();}
var iv=setInterval(tryClick,400);setTimeout(function(){clearInterval(iv);},90000);
var mo=new MutationObserver(tryClick);mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){mo.disconnect();},90000);})();
