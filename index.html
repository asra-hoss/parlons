<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- Installable web app (PWA): Safari's "Add to Home Screen" gives
         the app its own icon and a full-screen, standalone launch.
         The file-referencing <link>s (manifest, touch icon, favicon)
         are injected into the built HTML by build-static.mjs —
         Bun resolves relative link hrefs as bundle assets, so they
         cannot live in this source file. The files themselves live
         in client/public/ and ship verbatim at the site root. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <meta name="theme-color" content="#7a5ff0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Élan" />
    <!-- Persian/Arabic-script font, SELF-HOSTED (no CDN):
         Vazirmatn woff2 files live in client/public/fonts/ and
         ship verbatim at ./fonts/. Every element marked
         lang="fa" (tap-a-word glosses, flashcard meanings,
         Persian grammar explanations) or lang="ar" (Arabic
         translations from the global language picker) renders
         in Vazirmatn; Latin/French text keeps its own fonts.
         Line-height is generous: the script needs it. -->
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("./assets/fonts/vazirmatn-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("./assets/fonts/vazirmatn-bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      [lang="fa"],
      [lang="ar"] {
        font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
        line-height: 2;
      }
      /* Latin font, SELF-HOSTED (no CDN): Nunito variable woff2
         (weights 400–800 in one file), the rounded geometric sans
         of the Lingua-style theme. The font-family itself is
         applied in theme.css. */
      @font-face {
        font-family: "Nunito";
        src: url("./assets/fonts/nunito.woff2") format("woff2");
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }
      /* Rounded display font, SELF-HOSTED: Fredoka variable
         ttf (weights 300–700) in client/public/fonts/,
         shipped like Nunito's. Used by the Home v6 screen
         (bar counter, level title, star chip, Continue)
         and already named by the Bubble Dream stack. */
      @font-face {
        font-family: "Fredoka";
        src: url("./assets/fonts/fredoka.ttf") format("truetype");
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- Dark mode (Nov 7, 2026): apply the saved choice
         (Settings → « Dark mode », origb1:dark-mode)
         BEFORE first paint, so a dark-mode learner never
         sees a light flash. Default = light. The
         useDarkMode hook in App.tsx keeps this attribute
         in sync afterwards. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          window.localStorage.getItem("origb1:dark-mode") === "1"
            ? "dark"
            : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Élan — Français de A1 à C2</title>
    
  <link rel="stylesheet" crossorigin href="./assets/index-80g0rakg.css"><script type="module" crossorigin src="./assets/index-v5qha6s8.js"></script></head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="french-original-b1-sample"
    ></div>
  </body>
</html>
