<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Collection — Chichilang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{ --ink:#2b2350; --vio:#6c5ee0; --gold:#ffc93c; }
body{font-family:'Nunito',sans-serif;color:var(--ink);max-width:520px;margin:0 auto;padding:0 14px 0;min-height:100vh;
  background:
    radial-gradient(ellipse 90% 340px at 50% -60px, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
    radial-gradient(circle at 12% 22%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(circle at 84% 12%, rgba(255,255,255,.45) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 38%, rgba(255,255,255,.40) 0 2px, transparent 3px),
    linear-gradient(180deg,#c9dcf9 0%,#dfe9fd 55%,#eef4ff 100%);
  background-attachment:fixed}
h1,h2,.fr{font-family:'Fredoka',sans-serif}
.ttl{font-family:'Fredoka';font-weight:700;font-size:32px;color:var(--vio);text-align:center;margin-top:16px;text-shadow:0 2px 0 #ffffff}
.topbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.pbar{flex:1;height:34px;background:#f7f8fe;border:3px solid #ffffff;border-radius:99px;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(90,110,200,.20), inset 0 2px 5px rgba(120,140,220,.15)}
.pbar i{position:absolute;inset:0;width:0%;background:linear-gradient(180deg,#c3d2fb,#a9bcf5);border-radius:99px;transition:width .5s}
.pbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-size:17px;color:var(--vio);letter-spacing:.03em}
.coinpill{flex:none;display:flex;align-items:center;gap:7px;background:#ffffff;border:3px solid #dbe4fd;border-radius:99px;padding:4px 14px 4px 6px;font-family:'Fredoka';font-weight:700;font-size:17px;color:var(--vio)}
.coinpill img{width:26px;height:26px}
.search{position:relative;margin-top:12px}
.search input{width:100%;border:3px solid #c3d2f6;background:#ffffff;border-radius:99px;padding:13px 18px 13px 46px;font-family:'Nunito';font-weight:800;font-size:16px;color:var(--ink);outline:none;box-shadow:0 8px 20px rgba(90,110,200,.16)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--vio)}
.view{display:none}.view.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px;margin-top:20px;padding:0 2px}
.med{cursor:pointer;text-align:center}
.med:active{transform:scale(.97)}
.med .ring{width:92%;margin:0 auto;aspect-ratio:1;border-radius:50%;padding:5px;background:linear-gradient(180deg,#fbeecd,#f0daa6);box-shadow:0 8px 18px rgba(90,110,200,.28)}
.med .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid rgba(255,255,255,.8)}
.med .plate{margin:-12px auto 0;position:relative;width:86%;border-radius:12px;padding:6px 4px 5px;color:#fff;box-shadow:0 5px 12px rgba(90,110,200,.25);border:2px solid rgba(255,255,255,.6)}
.med .plate .a{font-family:'Fredoka';font-weight:700;font-size:16px;line-height:1.1;text-shadow:0 1px 3px rgba(60,40,120,.35)}
.med .plate .b{font-family:'Fredoka';font-weight:600;font-size:12.5px;line-height:1.15;opacity:.97;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em;text-shadow:0 1px 3px rgba(60,40,120,.35)}
.med .dname{font-family:'Fredoka';font-weight:600;font-size:14.5px;color:#6553e6;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.med .mark{margin-top:6px;height:26px;display:flex;align-items:center;justify-content:center}
.med .chk{font-size:27px;color:#58cc02;font-weight:900;text-shadow:0 2px 0 #2f7a01,0 4px 10px rgba(90,140,60,.3);line-height:1}
.med .chip{background:#ffffff;border:2px solid #d5defc;color:var(--vio);font-family:'Fredoka';font-weight:700;font-size:13px;border-radius:99px;padding:2px 12px;box-shadow:0 4px 10px rgba(90,110,200,.18)}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;background:#ffffff;border:3px solid #d5defc;color:#2b74d6;font-family:'Fredoka';font-weight:700;font-size:15px;border-radius:99px;padding:8px 18px;cursor:pointer;box-shadow:0 5px 12px rgba(90,110,200,.18)}
.vtitle{font-family:'Fredoka';font-weight:700;font-size:27px;margin-top:16px;color:#6553e6}
.vsub{font-weight:800;font-size:14px;color:#8b93c9;margin-top:2px}
.board{margin-top:16px;border-radius:26px;padding:8px;background:#ffffff;box-shadow:0 18px 40px rgba(90,110,200,.28)}
.board .in{background:#f4f8ff;border-radius:20px;padding:16px 12px 20px;position:relative}
.board .banner{margin:-16px -12px 14px;border-radius:20px 20px 0 0;padding:16px 44px 14px 16px;color:#fff;position:relative}
.board .banner .t{font-family:'Fredoka';font-weight:700;font-size:23px;text-shadow:0 2px 4px rgba(60,40,120,.30)}
.board .banner .s{font-weight:800;font-size:13px;opacity:.95;text-shadow:0 1px 3px rgba(60,40,120,.30)}
.board .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#e5322d 70%);border:3px solid #ffb3ab;color:#fff;font-family:'Fredoka';font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #a1160f;display:flex;align-items:center;justify-content:center}
.board .pbar{border-color:#d5defc;height:30px;background:#e8eefc}
.board .pbar b{font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px}
.lcard{cursor:pointer;position:relative;background:#fff;border-radius:16px;padding:5px;box-shadow:0 0 0 3px #dbe4fd,0 8px 16px rgba(90,110,200,.16)}
.lcard:active{transform:scale(.97)}
.lcard .pic{border-radius:11px;overflow:hidden;aspect-ratio:1/1;background:#eef2fd}
.lcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .nm{margin-top:5px;border-radius:10px;color:#fff;font-family:'Fredoka';font-weight:600;font-size:12px;line-height:1.2;text-align:center;padding:6px 3px;height:3.1em;display:flex;align-items:center;justify-content:center;overflow:hidden;text-shadow:0 1px 3px rgba(60,40,120,.35)}
.lcard .star{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:24px;color:var(--gold);text-shadow:0 2px 0 #d99a06,0 3px 6px rgba(120,90,20,.35);z-index:2;line-height:1}
.lcard .rib{position:absolute;top:12px;left:-4px;z-index:2;background:var(--vio);color:#fff;font-family:'Fredoka';font-weight:700;font-size:10.5px;border-radius:0 99px 99px 0;padding:3px 9px 3px 7px;box-shadow:0 3px 6px rgba(90,80,200,.3)}
.lcard.miss{background:#edf0f8;box-shadow:0 0 0 3px #dde4f4}
.lcard.miss .pic img{filter:grayscale(1) brightness(1.75) contrast(.8);opacity:.38}
.lcard.miss .nm{background:#ccd4ea!important;color:#a3aed2;text-shadow:none}
.lcard.miss .star{color:#ccd4ea;text-shadow:none}
.mgrid.lvcol{grid-template-columns:1fr;max-width:235px;margin-left:auto;margin-right:auto;gap:28px}
.res{display:flex;align-items:center;gap:12px;background:#ffffff;border-radius:18px;padding:12px 14px;margin-top:10px;cursor:pointer;box-shadow:0 6px 16px rgba(90,110,200,.16);color:var(--ink)}
.res .rl{flex:none;font-family:'Fredoka';font-weight:700;font-size:13px;color:#fff;border-radius:10px;padding:5px 9px}
.res .rt{flex:1;min-width:0}
.res .rt .a{font-family:'Fredoka';font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rt .b{color:#8b93c9;font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .st{flex:none;font-weight:900;font-size:13px}
.res .mtag{flex:none;font-family:'Fredoka';font-weight:700;font-size:10.5px;color:#6553e6;background:#eef0fe;border:2px solid #d5defc;border-radius:99px;padding:3px 8px}
.res.pvrow{align-items:flex-start}
.res .rt .pv{margin-top:6px;font-size:13.5px;font-weight:700;color:#4a4570;line-height:1.45}
.res .rt .pv .pvf{font-family:'Fredoka';font-weight:600;color:#2f2a55}
.res .rt .pv .pvb{color:#6a6590;font-weight:700}
.res .rt .pvx{margin-top:2px;font-size:12.5px;font-weight:600;color:#8b93c9;line-height:1.4}
.res .rt .hl{background:#ffe9a8;border-radius:4px;padding:0 1px;color:inherit}
.lcard .nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60}
.bnav .cap{display:flex;gap:6px;border-radius:28px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(180deg,#ffffff,#d9ecff);padding:8px;box-shadow:0 20px 38px -14px rgba(23,68,117,.55)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:20px;padding:8px 1px;text-decoration:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:11px;line-height:1.1;color:#1270cc;background:linear-gradient(180deg,#ffffff,#e9f4ff);box-shadow:0 6px 12px -6px rgba(23,68,117,.45), inset 0 2px 3px rgba(255,255,255,.9)}
.bnav a.on{background:linear-gradient(180deg,#35a2f7,#0f6fd0);color:#ffffff;transform:scale(1.07);box-shadow:0 14px 24px -8px rgba(14,84,150,.85), inset 0 2px 3px rgba(255,255,255,.5)}
.bnav svg{width:24px;height:24px;display:block}


body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.scrollframe{flex:1;overflow-y:auto;width:100%;padding-bottom:118px;-webkit-overflow-scrolling:touch}
.bnav{position:fixed!important;left:50%;transform:translateX(-50%)!important;bottom:0}
.sticky{position:static;flex:none;background:linear-gradient(180deg,#c9dcf9,#e3ebfd);margin:0 -14px;padding:4px 14px 12px;border-radius:0 0 22px 22px;box-shadow:0 12px 24px -12px rgba(90,110,200,.35)}
.sticky .ttl{margin-top:8px}
.bnav{background:#e9efff;width:100%;max-width:520px;padding:10px 8px max(10px, env(safe-area-inset-bottom));box-shadow:0 -10px 24px -12px rgba(90,110,200,.25)}
.bnav .cap{max-width:504px;margin:0 auto}
.empty{text-align:center;color:#8b93c9;font-weight:800;padding:36px 10px;font-size:15px}
</style>
</head>

  if(words.every(w=>snorm(l.t).indexOf(w)>=0)) return {tier:0};
  if(words.every(w=>snorm(l.goal).indexOf(w)>=0)) return {tier:1};
  if(words.every(w=>snorm(l.dos).indexOf(w)>=0)) return {tier:2};
  if(raw === (''+l.lv).toLowerCase()) return {tier:2};
  if(!deep || !SNORM) return null;
  const ix = SNORM[l.dir]; if(!ix) return null;
  let it = bestItem(ix.fc, words, x=>words.every(w=>x.nf.indexOf(w)>=0)?0:1);
  if(it) return {tier:3, it:it};
  it = bestItem(ix.gr, words, x=>words.every(w=>x.nt.indexOf(w)>=0)?0:1);
  if(it) return {tier:4, it:it};
  it = bestItem(ix.tx, words, ()=>0);
  if(it) return {tier:5, it:it};
  return null;
}
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ACC = {a:'aàáâäãå',e:'eèéêë',i:'iìíîï',o:'oòóôöõ',u:'uùúûü',c:'cç',n:'nñ',y:'yÿ'};
let curWords = [];
function hl(text){
  let out = esc(text);
  curWords.forEach(w=>{
    if(!w) return;
    const pat = w.split('').map(ch=>{
      const b = snorm(ch);
      if(ACC[b]) return '['+ACC[b]+']';
      return b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    }).join('');
    if(!pat) return;
    try{ out = out.replace(new RegExp('('+pat+')','gi'), '<b class="hl">$1</b>'); }catch(e){}
  });
  return out;
}
function previewOf(h){
  const it = h.it; if(!it) return '';
  if(h.tier===3) return '<div class="pv"><span class="pvf">'+hl(it.f)+'</span>'+(it.b?' <span class="pvb">— '+hl(it.b)+'</span>':'')+'</div>'+(it.x?'<div class="pvx">'+hl(it.x)+'</div>':'');
  if(h.tier===4) return '<div class="pv"><span class="pvf">'+hl(it.t)+'</span></div>'+(it.s?'<div class="pvx">'+hl(it.s)+'</div>':'');
  if(h.tier===5) return '<div class="pv">'+hl(it.s)+'</div>';
  return '';
}
function tagOf(h){ return h.tier===5 && h.it ? h.it.kind : TIERS[h.tier]; }
function linkOf(h){
  if(h.it && h.tier>=3) return '/'+h.l.dir+'/#dl='+h.it.scr+((h.it.card!==undefined && h.it.card>=0)?'&fc='+h.it.card:'');
  return '/'+h.l.dir+'/';
}
function runSearch(){
  const raw = q.value.trim().toLowerCase();
  if(!raw){ show('v-home'); return; }
  const s = snorm(raw);
  const words = s.split(' ').filter(Boolean);
  curWords = words;
  const deep = !!SNORM && s.length >= 2;
  const hits = [];
  DATA.forEach(l=>{ const m = matchTier(l, words, raw, deep); if(m) hits.push({l:l, tier:m.tier, it:m.it||null}); });
  hits.sort((a,b)=> a.tier-b.tier || a.l.n-b.l.n);
  const shown = hits.slice(0, 80);
  document.getElementById('v-search').innerHTML =
    '<div class="vtitle">Search</div><div class="vsub">'+hits.length+' result'+(hits.length===1?'':'s')+(hits.length>shown.length ? ' · showing '+shown.length : '')+'</div>'
    + (shown.length ? shown.map(h=>{ const l = h.l, pv = previewOf(h);
        return '<div class="res'+(pv?' pvrow':'')+'" data-href="'+linkOf(h)+'"><div class="rl" style="background:'+LCOL[l.lv]+'">'+l.lv+'</div>'
        + '<div class="rt"><div class="a">'+l.t+'</div><div class="b">'+l.dos+' · '+l.goal+'</div>'+pv+'</div>'
        + '<div class="mtag">'+tagOf(h)+'</div>'
        + '<div class="st" style="color:'+(l.st===2 ? '#46a302' : (l.st===1 ? '#6c5ee0' : '#b3aed2'))+'">'+(l.st===2 ? '✓ Collected' : (l.st===1 ? 'In progress' : 'Not started'))+'</div></div>';
      }).join('') : '<div class="empty">Nothing matches that search yet.</div>');
  document.querySelectorAll('#v-search .res').forEach(r=>r.onclick=()=>{ location.href=r.dataset.href; });
  show('v-search');
}
q.addEventListener('input', runSearch);
renderHome();
</script>
