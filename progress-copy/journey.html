<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Journey — sample</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#0e1a2b; overflow:hidden; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #frame { position:relative; height:100%; aspect-ratio:2/3; max-width:100vw; overflow:hidden; }
  video.drift { animation:drift 7s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:scale(1.03) translate(0, 0); } to { transform:scale(1.10) translate(-0.9%, -1.4%); } }
  @media (max-aspect-ratio: 2/3) { #frame { width:100vw; height:auto; } }
  video { width:100%; height:100%; object-fit:cover; display:block; background:#0e1a2b; }
  .topbar { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; pointer-events:none; }
  .title { color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 6px rgba(0,0,0,.55); letter-spacing:.02em; }
  .stars { display:flex; align-items:center; gap:6px; background:rgba(10,20,35,.45); border:1px solid rgba(255,255,255,.35); color:#ffd94d; font-weight:800; font-size:16px; padding:5px 12px 5px 8px; border-radius:999px; backdrop-filter:blur(3px); }
  .stars svg { width:18px; height:18px; }
  .stars.bump { animation:bump .45s ease; }
  @keyframes bump { 35% { transform:scale(1.25); } }
  #bubble { position:absolute; width:92px; height:92px; margin:-46px 0 0 -46px; border-radius:50%; border:none; cursor:pointer; z-index:5;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 70% 80%, rgba(255,120,220,.35), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 30% 75%, rgba(90,200,255,.35), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.16), rgba(255,255,255,.05) 70%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset -8px -10px 18px rgba(120,160,255,.35), 0 0 26px 6px rgba(255,205,70,.75), 0 0 60px 18px rgba(255,170,40,.35);
    display:flex; align-items:center; justify-content:center;
    animation:bob 2.6s ease-in-out infinite, glowpulse 1.6s ease-in-out infinite;
    transition:opacity .25s ease, transform .25s ease;
  }
  #bubble svg { width:20px; height:20px; opacity:.95; filter:drop-shadow(0 0 6px rgba(255,190,60,.9)); }
  #bubble.enter { animation:bob 2.6s ease-in-out infinite, glowpulse 1.6s ease-in-out infinite, enter .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bob { 0%,100% { margin-top:-50px; } 50% { margin-top:-42px; } }
  @keyframes glowpulse { 0%,100% { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset -8px -10px 18px rgba(120,160,255,.35), 0 0 22px 5px rgba(255,205,70,.65), 0 0 52px 14px rgba(255,170,40,.28); } 50% { box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), inset -8px -10px 18px rgba(120,160,255,.4), 0 0 34px 10px rgba(255,210,80,.9), 0 0 74px 24px rgba(255,180,50,.45); } }
  @keyframes enter { 0% { transform:scale(.2); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  #bubble.hide { opacity:0; transform:scale(1.6); pointer-events:none; }
  #blabel { position:absolute; transform:translate(-50%, 0); z-index:5; background:rgba(10,20,35,.55); color:#fff; font-size:13px; font-weight:700; padding:5px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.35); white-space:nowrap; pointer-events:none; backdrop-filter:blur(3px); }
  .spark { position:absolute; z-index:6; pointer-events:none; border-radius:50%; }
  .spark.star { border-radius:0; background:transparent; }
  #ring { position:absolute; z-index:6; border:3px solid rgba(255,215,90,.9); border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); }
  .bottombar { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:center; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); pointer-events:none; }
  .dots { display:flex; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.35); border:1px solid rgba(255,255,255,.5); }
  .dot.done { background:#ffd94d; border-color:#ffd94d; box-shadow:0 0 8px rgba(255,205,70,.9); }
  .dot.now { background:#fff; }
  #restart { pointer-events:auto; background:rgba(10,20,35,.5); color:#fff; border:1px solid rgba(255,255,255,.4); font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(3px); }
  #endcard { position:absolute; inset:0; z-index:8; display:none; align-items:center; justify-content:center; background:rgba(8,14,26,.45); }
  #endcard.show { display:flex; }
  .card { background:rgba(255,252,244,.97); border-radius:22px; padding:28px 30px; text-align:center; max-width:78%; box-shadow:0 18px 50px rgba(0,0,0,.4); animation:enter .5s cubic-bezier(.2,1.6,.4,1); }
  .card svg { width:64px; height:64px; }
  .card h1 { font-size:21px; color:#20304a; margin:10px 0 4px; }
  .card p { font-size:14px; color:#5a6a84; margin-bottom:16px; }
  .card button { background:#ffb62e; border:none; color:#402c00; font-weight:800; font-size:15px; padding:11px 22px; border-radius:999px; cursor:pointer; box-shadow:0 4px 14px rgba(255,170,30,.5); }
  #ambient { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:3; }
  .amb-b { position:absolute; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.9) 0 7%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 70% 80%, rgba(255,120,220,.28), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 30% 75%, rgba(90,200,255,.28), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.13), rgba(255,255,255,.04) 70%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5), inset -4px -6px 10px rgba(120,160,255,.3);
    display:flex; align-items:center; justify-content:center;
    animation:ambfloat ease-in-out infinite alternate; }
  .amb-b svg { width:38%; height:38%; opacity:.9; }
  @keyframes ambfloat { from { transform:translate(0, 10px); } to { transform:translate(9px, -14px); } }
  .amb-leaf { position:absolute; top:-6%; animation:ambfall linear infinite; opacity:.9; }
  @keyframes ambfall { 0% { transform:translate(0, -4vh) rotate(0deg); } 25% { transform:translate(16px, 26vh) rotate(110deg); } 50% { transform:translate(-10px, 54vh) rotate(210deg); } 75% { transform:translate(14px, 80vh) rotate(300deg); } 100% { transform:translate(-6px, 108vh) rotate(380deg); } }
  .amb-s { position:absolute; animation:ambtw ease-in-out infinite; }
  @keyframes ambtw { 0%, 100% { transform:scale(.35) rotate(0deg); opacity:.15; } 50% { transform:scale(1) rotate(35deg); opacity:.95; } }
  #hint { position:absolute; left:50%; bottom:12%; transform:translateX(-50%); z-index:4; color:#fff; font-size:13.5px; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.7); background:rgba(10,20,35,.35); padding:6px 14px; border-radius:999px; pointer-events:none; transition:opacity .4s; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <video id="v" playsinline muted preload="auto" poster="castle-journey-poster.jpg" src="castle-journey.mp4"></video>
    <div id="ambient"></div>
    <div class="topbar">
      <div class="title">Castle Journey</div>
      <div class="stars" id="starpill"><svg viewBox="0 0 24 24" fill="#ffd94d"><path d="M12 1.8l3.1 6.9 7.5.7-5.6 5 1.6 7.4L12 18l-6.6 3.8L7 14.4 1.4 9.4l7.5-.7z"/></svg><span id="starnum">0</span></div>
    </div>
    <div id="hint">Tap the bubble to pop it</div>
    <button id="bubble" aria-label="Pop the bubble"></button>
    <div id="blabel">Dossier 1</div>
    <div class="bottombar">
      <div class="dots" id="dots"></div>
      <button id="restart">Restart</button>
    </div>
    <div id="endcard">
      <div class="card">
        <svg viewBox="0 0 24 24" fill="#ffb62e"><path d="M12 1.8l3.1 6.9 7.5.7-5.6 5 1.6 7.4L12 18l-6.6 3.8L7 14.4 1.4 9.4l7.5-.7z"/></svg>
        <h1>You reached the castle!</h1>
        <p id="endstars">5 stars collected</p>
        <button id="again">Walk it again</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var v = document.getElementById('v');
  var bubble = document.getElementById('bubble');
  var blabel = document.getElementById('blabel');
  var hint = document.getElementById('hint');
  var starnum = document.getElementById('starnum');
  var starpill = document.getElementById('starpill');
  var dotsBox = document.getElementById('dots');
  var endcard = document.getElementById('endcard');
  var frame = document.getElementById('frame');

  var STOPS = [1.25, 2.5, 3.75, 5.0, 6.25, 7.5, 8.75, 9.9];
  var POS = [
    { x: 63, y: 74 }, { x: 44, y: 68 }, { x: 57, y: 63 }, { x: 41, y: 58 },
    { x: 55, y: 52 }, { x: 45, y: 47 }, { x: 54, y: 41 }, { x: 50, y: 35 }
  ];
  var stage = 0, stars = 0, busy = false, finished = false, targetT = 0;

  for (var i = 0; i < STOPS.length; i++) {
    var d = document.createElement('div'); d.className = 'dot'; dotsBox.appendChild(d);
  }
  var dots = dotsBox.children;

  function placeBubble(enter) {
    var p = POS[stage];
    bubble.style.left = p.x + '%';
    bubble.style.top = p.y + '%';
    blabel.style.left = p.x + '%';
    blabel.style.top = 'calc(' + p.y + '% + 56px)';
    blabel.textContent = 'Dossier ' + (stage + 1);
    bubble.classList.remove('hide');
    if (enter) { bubble.classList.remove('enter'); void bubble.offsetWidth; bubble.classList.add('enter'); }
    for (var i = 0; i < dots.length; i++) dots[i].className = 'dot' + (i < stage ? ' done' : (i === stage ? ' now' : ''));
  }

  function burst(x, y) {
    var rect = frame.getBoundingClientRect();
    var cx = rect.width * x / 100, cy = rect.height * y / 100;
    var ring = document.createElement('div'); ring.id = 'ring';
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px'; ring.style.width = '20px'; ring.style.height = '20px';
    frame.appendChild(ring);
    ring.animate([{ width: '20px', height: '20px', opacity: 1 }, { width: '190px', height: '190px', opacity: 0 }], { duration: 550, easing: 'ease-out' }).onfinish = function () { ring.remove(); };
    for (var i = 0; i < 30; i++) {
      var s = document.createElement('div');
      var isStar = i % 3 === 0, size = isStar ? 13 : 5 + Math.random() * 6;
      s.className = 'spark' + (isStar ? ' star' : '');
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.width = size + 'px'; s.style.height = size + 'px';
      if (isStar) {
        s.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="#ffd94d"><path d="M12 1.8l3.1 6.9 7.5.7-5.6 5 1.6 7.4L12 18l-6.6 3.8L7 14.4 1.4 9.4l7.5-.7z"/></svg>';
      } else {
        s.style.background = ['#ffd94d', '#fff3b0', '#ffb62e', '#ffffff'][i % 4];
        s.style.boxShadow = '0 0 8px rgba(255,200,60,.95)';
      }
      frame.appendChild(s);
      var ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 130;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40;
      s.animate([
        { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + (dy + 90) + 'px)) rotate(' + (Math.random() * 260 - 130) + 'deg) scale(.4)', opacity: 0 }
      ], { duration: 620 + Math.random() * 420, easing: 'cubic-bezier(.15,.6,.4,1)' }).onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }

  function arrive() {
    if (!busy) return;
    busy = false;
    v.pause();
    if (stage >= STOPS.length) {
      finished = true;
      for (var i = 0; i < dots.length; i++) dots[i].className = 'dot done';
      document.getElementById('endstars').textContent = stars + (stars === 1 ? ' star' : ' stars') + ' collected';
      endcard.classList.add('show');
    } else {
      v.classList.add('drift');
      placeBubble(true);
    }
  }

  v.addEventListener('timeupdate', function () {
    if (busy && v.currentTime >= targetT) arrive();
  });
  v.addEventListener('ended', function () { if (busy) arrive(); });

  function pop() {
    if (busy || finished) return;
    busy = true;
    var p = POS[stage];
    burst(p.x, p.y);
    bubble.classList.add('hide');
    blabel.style.opacity = '0';
    hint.style.opacity = '0';
    stars++; starnum.textContent = stars;
    starpill.classList.remove('bump'); void starpill.offsetWidth; starpill.classList.add('bump');
    v.classList.remove('drift');
    targetT = STOPS[stage];
    stage++;
    setTimeout(function () {
      blabel.style.opacity = '1';
      try { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
      var startT = v.currentTime, checks = 0;
      var wd = setInterval(function () {
        if (!busy) { clearInterval(wd); return; }
        if (v.currentTime > startT + 0.15) { clearInterval(wd); return; }
        if (++checks >= 3) { clearInterval(wd); try { v.currentTime = targetT; } catch (e) {} arrive(); }
      }, 350);
    }, 480);
  }

  function restart() {
    stage = 0; stars = 0; busy = false; finished = false; targetT = 0;
    starnum.textContent = '0';
    endcard.classList.remove('show');
    try { v.pause(); v.currentTime = 0; } catch (e) {}
    blabel.style.opacity = '1'; hint.style.opacity = '1';
    placeBubble(true);
  }

  bubble.addEventListener('click', pop);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('again').addEventListener('click', restart);
  v.addEventListener('loadedmetadata', function () { try { v.currentTime = 0; } catch (e) {} });
  (function buildAmbient() {
    var amb = document.getElementById('ambient');
    var star = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="#ffd94d"><path d="M12 1.8l3.1 6.9 7.5.7-5.6 5 1.6 7.4L12 18l-6.6 3.8L7 14.4 1.4 9.4l7.5-.7z"/></svg>';
    var glow = document.createElement('div');
    glow.style.cssText = 'position:absolute; inset:0; background:radial-gradient(circle at 50% 26%, rgba(255,225,150,.28), rgba(255,225,150,0) 55%); animation:ambtw 5.5s ease-in-out infinite;';
    amb.appendChild(glow);
    var leafPath = 'M12 1 C15 6 21 8 22 12 C18 13 17 16 18 21 C14 18 10 18 6 21 C7 16 6 13 2 12 C3 8 9 6 12 1 Z';
    var cols = ['#e8862e', '#d95f26', '#c9452c', '#eda93c', '#b84a39'];
    for (var i = 0; i < 9; i++) {
      var lf = document.createElement('div'); lf.className = 'amb-leaf';
      var sz = 13 + (i % 4) * 4;
      lf.style.left = (4 + i * 11) + '%';
      lf.style.width = sz + 'px'; lf.style.height = sz + 'px';
      lf.style.animationDuration = (11 + i * 1.7) + 's';
      lf.style.animationDelay = (-i * 2.3) + 's';
      lf.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="' + cols[i % cols.length] + '"><path d="' + leafPath + '"/></svg>';
      amb.appendChild(lf);
    }
    for (var j = 0; j < 12; j++) {
      var sp = document.createElement('div'); sp.className = 'amb-s';
      var ss = 8 + (j % 3) * 4;
      sp.style.left = (6 + (j * 29) % 88) + '%'; sp.style.top = (8 + (j * 37) % 80) + '%';
      sp.style.width = ss + 'px'; sp.style.height = ss + 'px';
      sp.style.animationDuration = (2.2 + (j % 5) * 0.6) + 's';
      sp.style.animationDelay = (-j * 0.7) + 's';
      sp.innerHTML = star;
      amb.appendChild(sp);
    }
  })();
  v.classList.add('drift');
  placeBubble(false);
  window.__journey = { pop: pop, restart: restart, state: function () { return { stage: stage, stars: stars, busy: busy, finished: finished, t: v.currentTime, ready: v.readyState }; } };
})();
</script>
</body>
</html>
