<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Castle Path — Wish Bubbles (Cursor prototype)</title>
  <style>
    :root {
      --ink: #1c2430;
      --panel: rgba(255, 252, 247, 0.94);
      --muted: #5a6573;
      --gold: #f0c14a;
      --persp: 820px;
      --art: url("./castle-bubbles.webp");
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1520;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header.bar {
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(14,21,32,.78), rgba(14,21,32,.28));
      color: #f7f1e6;
      backdrop-filter: blur(8px);
    }
    header.bar h1 { margin: 0; font-size: 15px; font-weight: 700; }
    header.bar p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .stage-wrap {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 50% 0%, #3a5478 0%, transparent 55%),
        linear-gradient(180deg, #1a2a3d, #0e1520 70%);
      overflow: hidden;
    }

    /* Phone-shaped stage with real CSS perspective (into the scene). */
    .viewport {
      position: relative;
      height: 100%;
      width: auto;
      max-width: min(100%, 440px);
      aspect-ratio: 1136 / 2080;
      overflow: hidden;
      background: #071018;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      perspective: var(--persp);
      perspective-origin: 50% 18%;
      transform-style: preserve-3d;
    }

    .world {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    /* Depth plates: same painting, different Z + scale so they align at rest,
       then separate with true parallax as the traveller walks forward. */
    .plate {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      background-image: var(--art);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }

    /* Layers use CSS vars so near/far can move at different rates.
       Castle/sky is pinned at the top (transform-origin) so the crown stays in frame
       while still growing as we walk nearer. */
    .plate-sky {
      width: 112%;
      height: 112%;
      margin-left: -56%;
      margin-top: -56%;
      transform-origin: 50% 8%;
      transform: translate3d(var(--sky-x, 0%), var(--sky-y, 0%), var(--sky-z, -640px))
                 scale(var(--sky-s, 1.78));
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom,
        #000 0%, #000 44%, rgba(0,0,0,.9) 56%, rgba(0,0,0,.25) 70%, transparent 82%);
      mask-image: linear-gradient(to bottom,
        #000 0%, #000 44%, rgba(0,0,0,.9) 56%, rgba(0,0,0,.25) 70%, transparent 82%);
      filter: saturate(1.05);
    }

    .plate-mid {
      width: 112%;
      height: 112%;
      margin-left: -56%;
      margin-top: -56%;
      transform-origin: 50% 45%;
      transform: translate3d(var(--mid-x, 0%), var(--mid-y, 0%), var(--mid-z, -320px))
                 scale(var(--mid-s, 1.39));
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 16%, rgba(0,0,0,.55) 30%, #000 42%, #000 64%, rgba(0,0,0,.45) 76%, transparent 88%);
      mask-image: linear-gradient(to bottom,
        transparent 16%, rgba(0,0,0,.55) 30%, #000 42%, #000 64%, rgba(0,0,0,.45) 76%, transparent 88%);
    }

    .plate-near {
      width: 110%;
      height: 110%;
      margin-left: -55%;
      margin-top: -55%;
      transform-origin: 50% 85%;
      transform: translate3d(var(--near-x, 0%), var(--near-y, 0%), var(--near-z, -100px))
                 scale(var(--near-s, 1.12));
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 44%, rgba(0,0,0,.4) 56%, #000 68%, #000 100%);
      mask-image: linear-gradient(to bottom,
        transparent 44%, rgba(0,0,0,.4) 56%, #000 68%, #000 100%);
    }

    .plate-feet {
      width: 155%;
      height: 80%;
      left: 50%;
      top: 88%;
      margin-left: -77.5%;
      margin-top: -16%;
      background-position: center 130%;
      background-size: 150% auto;
      transform-origin: 50% 0%;
      transform: translate3d(var(--feet-x, 0%), var(--feet-y, 0%), var(--feet-z, 80px))
                 rotateX(var(--feet-rx, 74deg)) scale(var(--feet-s, 1.15));
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 100%);
      opacity: .96;
      filter: brightness(.97) saturate(1.06);
    }

    .plate-base {
      width: 102%;
      height: 102%;
      margin-left: -51%;
      margin-top: -51%;
      transform-origin: 50% 8%;
      transform: translate3d(0, var(--base-y, 0%), var(--base-z, -760px))
                 scale(var(--base-s, 1.93));
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
      filter: saturate(1.02);
    }

    .markers {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
      transition: transform 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
    }

    .stone {
      position: absolute;
      width: calc(7% * var(--depth-scale, 1));
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(9px, 2.3vw, 13px);
      color: #f8f4ec;
      background: radial-gradient(circle at 35% 30%, #8d939c, #5c646e 62%, #3e454e);
      border: 1.5px solid rgba(255,255,255,.35);
      box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.28);
      transform: translate(-50%, -50%) translateZ(var(--z, 0px));
      transition: background .35s ease, box-shadow .35s ease, filter .35s ease, opacity .4s ease;
    }
    .stone.done {
      background: radial-gradient(circle at 35% 30%, #e0c07a, #b8872e 62%, #6e4a16);
      box-shadow: 0 0 0 2px rgba(255, 214, 120, .55), 0 6px 16px rgba(180, 120, 20, .35);
    }
    .stone.current {
      box-shadow: 0 0 0 3px rgba(255, 232, 170, .8), 0 8px 20px rgba(0,0,0,.35);
    }

    .bubble {
      position: absolute;
      width: var(--size, 10%);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) translateZ(var(--z, 0px));
      transform-style: preserve-3d;
    }
    .bubble .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transition: filter .55s ease, background .55s ease, box-shadow .55s ease,
                  opacity .45s ease, transform .35s ease;
    }
    .bubble.is-locked .orb {
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 40%),
        radial-gradient(circle at 50% 58%, rgba(190,198,206,.82), rgba(120,128,138,.9) 55%, rgba(78,86,96,.94));
      border: 1.5px solid rgba(220,226,232,.55);
      box-shadow: inset 0 0 14px rgba(255,255,255,.22), 0 4px 12px rgba(0,0,0,.22);
      filter: grayscale(1) saturate(.15) brightness(.95);
    }
    .bubble.is-locked .star { opacity: .22; filter: grayscale(1); }

    .bubble.is-ready .orb {
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,.75), transparent 36%),
        radial-gradient(circle at 70% 70%, rgba(255,186,120,.4), transparent 45%),
        radial-gradient(circle at 50% 55%, rgba(255,230,160,.6), rgba(180,220,255,.25) 48%, rgba(255,170,210,.2) 72%, rgba(120,170,220,.3));
      border: 1.5px solid rgba(255,255,255,.55);
      box-shadow:
        0 0 18px rgba(255, 210, 110, .8),
        0 0 36px rgba(255, 180, 80, .4),
        inset 0 0 14px rgba(255,255,255,.35);
      animation: bubblePulse 1.1s ease-in-out infinite;
    }
    .bubble.is-ready .star {
      opacity: 1;
      animation: starTwinkle .9s ease-in-out infinite;
    }

    .bubble.is-popping .orb {
      animation: none;
      opacity: 0;
      transform: scale(1.4);
      filter: brightness(2.2);
      transition: opacity .3s ease, transform .3s ease, filter .3s ease;
    }
    .bubble.is-popped { opacity: 0; visibility: hidden; }

    .star {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 34%;
      height: 34%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, #fff 0 18%, transparent 19%),
        linear-gradient(90deg, transparent 44%, #ffe9a0 44% 56%, transparent 56%),
        linear-gradient(0deg, transparent 44%, #ffe9a0 44% 56%, transparent 56%),
        linear-gradient(45deg, transparent 46%, rgba(255,240,180,.9) 46% 54%, transparent 54%),
        linear-gradient(-45deg, transparent 46%, rgba(255,240,180,.9) 46% 54%, transparent 54%);
      filter: drop-shadow(0 0 4px rgba(255, 210, 100, .9));
      transition: opacity .4s ease;
    }

    @keyframes bubblePulse {
      0%, 100% { box-shadow: 0 0 16px rgba(255,210,110,.7), 0 0 28px rgba(255,180,80,.28), inset 0 0 12px rgba(255,255,255,.3); }
      50% { box-shadow: 0 0 26px rgba(255,220,130,.95), 0 0 42px rgba(255,190,90,.45), inset 0 0 16px rgba(255,255,255,.45); }
    }
    @keyframes starTwinkle {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.18); opacity: .85; }
    }

    .burst {
      position: absolute;
      width: 1px;
      height: 1px;
      transform: translate(-50%, -50%) translateZ(var(--z, 20px));
      pointer-events: none;
      z-index: 8;
    }
    .burst .flash {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.2);
      background: radial-gradient(circle, #fff 0%, #ffe08a 35%, rgba(255,180,60,0) 70%);
      animation: flashPop .55s ease-out forwards;
    }
    .burst .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      margin: -2.5px;
      border-radius: 50%;
      background: var(--c, #ffe9a0);
      box-shadow: 0 0 6px var(--c, #ffe9a0);
      animation: sparkFly .75s ease-out forwards;
    }
    .burst .spark.starry {
      width: 9px;
      height: 9px;
      border-radius: 0;
      box-shadow: none;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: #ffe9a0;
    }
    @keyframes flashPop {
      0% { transform: translate(-50%, -50%) scale(.15); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(4.4); opacity: .9; }
      100% { transform: translate(-50%, -50%) scale(7); opacity: 0; }
    }
    @keyframes sparkFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(.12); opacity: 0; }
    }

    .traveller {
      position: absolute;
      width: 4.6%;
      aspect-ratio: 1;
      border-radius: 50%;
      left: 50%;
      top: 92%;
      transform: translate(-50%, -50%) translateZ(55px);
      background: radial-gradient(circle at 35% 30%, #fff6df, #f0c14a 45%, #b7791f 100%);
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 0 0 3px rgba(240, 193, 74, .35), 0 6px 14px rgba(0,0,0,.35);
      z-index: 9;
      transition: left 1.45s cubic-bezier(0.22, 0.7, 0.2, 1),
                  top 1.45s cubic-bezier(0.22, 0.7, 0.2, 1);
    }
    .traveller::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 110%;
      width: 70%;
      height: 35%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,.28), transparent 70%);
    }

    .door-glow {
      position: absolute;
      left: 50%;
      top: 19.5%;
      width: 12%;
      height: 7%;
      transform: translate(-50%, -50%) translateZ(-480px) scale(1.55);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,120,.55), transparent 70%);
      opacity: 0;
      filter: blur(2px);
      transition: opacity .8s ease;
      pointer-events: none;
    }
    .door-glow.on { opacity: 1; }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(6,10,18,.28) 100%);
      z-index: 12;
    }

    .arrived {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px 18px;
      background: linear-gradient(0deg, rgba(8,12,20,.55), transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease;
      z-index: 14;
    }
    .arrived.show { opacity: 1; }
    .arrived .card {
      background: var(--panel);
      padding: 14px 18px;
      border-radius: 14px;
      text-align: center;
      max-width: 260px;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      transform: translateY(10px);
      transition: transform .5s ease;
    }
    .arrived.show .card { transform: translateY(0); }
    .arrived h2 { margin: 0 0 4px; font-size: 16px; }
    .arrived p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

    footer.controls {
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(14,21,32,.9), rgba(14,21,32,.45));
      backdrop-filter: blur(8px);
      color: #f7f1e6;
    }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 18px;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:active { transform: translateY(1px) scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: linear-gradient(180deg, #f0c14a, #c47a1a);
      color: #1c1406;
      box-shadow: 0 6px 16px rgba(196, 122, 26, .35);
      min-width: 168px;
    }
    .btn-ghost {
      background: rgba(255,255,255,.1);
      color: #f7f1e6;
      border: 1px solid rgba(255,255,255,.18);
    }
    .status {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: rgba(247,241,230,.82);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div>
        <h1>Castle Path</h1>
        <p>Wish bubbles · Cursor prototype</p>
      </div>
      <div class="pill" id="progressPill">Lesson 0 / 8</div>
    </header>

    <div class="stage-wrap">
      <div class="viewport" id="viewport" aria-label="Path to the castle">
        <div class="world" id="world">
          <div class="plate plate-base" aria-hidden="true"></div>
          <div class="plate plate-sky" aria-hidden="true"></div>
          <div class="plate plate-mid" aria-hidden="true"></div>
          <div class="plate plate-near" aria-hidden="true"></div>
          <div class="plate plate-feet" aria-hidden="true"></div>
          <div class="door-glow" id="doorGlow"></div>
          <div class="markers" id="markers"></div>
          <div class="traveller" id="traveller" title="You"></div>
        </div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="arrived" id="arrived">
          <div class="card">
            <h2>Castle door</h2>
            <p>You reached the end of the level. The crown is yours.</p>
          </div>
        </div>
      </div>
    </div>

    <footer class="controls">
      <button type="button" class="btn-primary" id="btnComplete">Complete lesson</button>
      <button type="button" class="btn-ghost" id="btnReset">Reset</button>
      <div class="status" id="status">Grey bubbles wait ahead. Complete a lesson to wake the next wish.</div>
    </footer>
  </div>

  <script>
(function () {
  'use strict';

  /**
   * Lessons along the path. Each has a stone, a wish bubble beside it,
   * and a depth (negative Z = farther into the scene).
   * Camera walks forward in Z so near layers rush past and the castle grows.
   */
  var LESSONS = [
    { stone: { x: 0.50, y: 0.90 }, bubble: { x: 0.72, y: 0.87, size: 0.145 }, z: 35, sway: 0 },
    { stone: { x: 0.54, y: 0.78 }, bubble: { x: 0.80, y: 0.76, size: 0.125 }, z: -20, sway: -1.2 },
    { stone: { x: 0.46, y: 0.68 }, bubble: { x: 0.22, y: 0.69, size: 0.105 }, z: -75, sway: 1.0 },
    { stone: { x: 0.52, y: 0.58 }, bubble: { x: 0.70, y: 0.56, size: 0.095 }, z: -130, sway: -0.8 },
    { stone: { x: 0.48, y: 0.48 }, bubble: { x: 0.26, y: 0.49, size: 0.085 }, z: -185, sway: 0.6 },
    { stone: { x: 0.51, y: 0.40 }, bubble: { x: 0.66, y: 0.39, size: 0.075 }, z: -240, sway: -0.4 },
    { stone: { x: 0.49, y: 0.33 }, bubble: { x: 0.34, y: 0.325, size: 0.065 }, z: -295, sway: 0.25 },
    { stone: { x: 0.50, y: 0.26 }, bubble: { x: 0.58, y: 0.255, size: 0.055 }, z: -350, sway: 0 }
  ];

  /* Per-step depth keys. Near layers advance faster than the castle layer,
     so the world comes toward you with real parallax while the crown stays framed. */

  var world = document.getElementById('world');
  var markers = document.getElementById('markers');
  var traveller = document.getElementById('traveller');
  var doorGlow = document.getElementById('doorGlow');
  var arrived = document.getElementById('arrived');
  var btnComplete = document.getElementById('btnComplete');
  var btnReset = document.getElementById('btnReset');
  var statusEl = document.getElementById('status');
  var progressPill = document.getElementById('progressPill');

  var completed = 0;
  var busy = false;
  var bubbleEls = [];
  var stoneEls = [];

  function setStatus(t) { statusEl.textContent = t; }
  function setProgress() {
    progressPill.textContent = 'Lesson ' + completed + ' / ' + LESSONS.length;
  }

  function applyCamera(step) {
    var i = Math.max(0, Math.min(step, 8));
    var t = i / 8; /* 0 = trailhead, 1 = castle door */
    var ease = t * t * (3 - 2 * t);
    var root = document.documentElement;
    var sway = Math.sin(t * Math.PI * 2.2) * (1 - t) * 1.1;

    /* Castle/sky: grow from the crown, stay pinned near the top of the frame. */
    root.style.setProperty('--sky-z', (-640 + ease * 290) + 'px');
    root.style.setProperty('--sky-s', (1.78 + ease * 0.72).toFixed(3));
    root.style.setProperty('--sky-y', (ease * 0.4) + '%');
    root.style.setProperty('--sky-x', (sway * 0.25) + '%');

    root.style.setProperty('--base-z', (-760 + ease * 310) + 'px');
    root.style.setProperty('--base-s', (1.93 + ease * 0.55).toFixed(3));
    root.style.setProperty('--base-y', (ease * 0.3) + '%');

    /* Mid path: approaches faster than the castle. */
    root.style.setProperty('--mid-z', (-320 + ease * 420) + 'px');
    root.style.setProperty('--mid-s', (1.39 + ease * 0.95).toFixed(3));
    root.style.setProperty('--mid-y', (ease * 6) + '%');
    root.style.setProperty('--mid-x', (sway * 0.55) + '%');

    /* Near path: rushes toward and past the traveller. */
    root.style.setProperty('--near-z', (-100 + ease * 560) + 'px');
    root.style.setProperty('--near-s', (1.12 + ease * 1.45).toFixed(3));
    root.style.setProperty('--near-y', (ease * 16) + '%');
    root.style.setProperty('--near-x', (sway * 0.9) + '%');

    /* Ground underfoot: strongest motion, tips past the lens. */
    root.style.setProperty('--feet-z', (80 + ease * 580) + 'px');
    root.style.setProperty('--feet-s', (1.15 + ease * 1.55).toFixed(3));
    root.style.setProperty('--feet-y', (ease * 18) + '%');
    root.style.setProperty('--feet-x', (sway * 1.2) + '%');
    root.style.setProperty('--feet-rx', (74 - ease * 8) + 'deg');

    /* Subtle path sway on markers for first-person feel */
    markers.style.transform = 'translateX(' + (sway * 0.35) + '%)';
  }

  function placeTraveller(step) {
    var pt;
    if (step <= 0) pt = { x: 0.50, y: 0.94, z: 55 };
    else if (step >= LESSONS.length) pt = { x: 0.50, y: 0.22, z: -360 };
    else {
      var s = LESSONS[step - 1].stone;
      pt = { x: s.x, y: s.y, z: LESSONS[step - 1].z + 18 };
    }
    traveller.style.left = (pt.x * 100) + '%';
    traveller.style.top = (pt.y * 100) + '%';
    traveller.style.transform =
      'translate(-50%, -50%) translateZ(' + pt.z + 'px)';
  }

  function buildMarkers() {
    markers.innerHTML = '';
    bubbleEls = [];
    stoneEls = [];
    LESSONS.forEach(function (lesson, i) {
      var stone = document.createElement('div');
      stone.className = 'stone';
      stone.textContent = String(i + 1);
      stone.style.left = (lesson.stone.x * 100) + '%';
      stone.style.top = (lesson.stone.y * 100) + '%';
      stone.style.setProperty('--z', lesson.z + 'px');
      stone.style.setProperty('--depth-scale', (0.55 + 0.45 * (1 - i / Math.max(1, LESSONS.length - 1))).toFixed(2));
      markers.appendChild(stone);
      stoneEls.push(stone);

      var bubble = document.createElement('div');
      bubble.className = 'bubble is-locked';
      bubble.style.left = (lesson.bubble.x * 100) + '%';
      bubble.style.top = (lesson.bubble.y * 100) + '%';
      bubble.style.setProperty('--size', (lesson.bubble.size * 100) + '%');
      bubble.style.setProperty('--z', (lesson.z + 12) + 'px');
      bubble.innerHTML = '<div class="orb"></div><div class="star"></div>';
      markers.appendChild(bubble);
      bubbleEls.push(bubble);
    });
  }

  function refreshBubbleStates() {
    bubbleEls.forEach(function (el, i) {
      el.classList.remove('is-locked', 'is-ready', 'is-popping', 'is-popped');
      el.classList.add(i < completed ? 'is-popped' : 'is-locked');
    });
    stoneEls.forEach(function (el, i) {
      el.classList.remove('done', 'current');
      if (i < completed) el.classList.add('done');
      else if (i === completed && completed < LESSONS.length) el.classList.add('current');
    });
  }

  function spawnBurst(lesson) {
    var burst = document.createElement('div');
    burst.className = 'burst';
    burst.style.left = (lesson.bubble.x * 100) + '%';
    burst.style.top = (lesson.bubble.y * 100) + '%';
    burst.style.setProperty('--z', (lesson.z + 30) + 'px');

    var flash = document.createElement('div');
    flash.className = 'flash';
    flash.style.width = Math.round(56 + lesson.bubble.size * 280) + 'px';
    flash.style.height = flash.style.width;
    burst.appendChild(flash);

    var colors = ['#fff6c8', '#ffe08a', '#ffd060', '#fff', '#f0c14a', '#ffb347'];
    for (var i = 0; i < 22; i++) {
      var spark = document.createElement('div');
      spark.className = 'spark' + (i % 3 === 0 ? ' starry' : '');
      var ang = (Math.PI * 2 * i) / 22 + Math.random() * 0.35;
      var dist = 36 + Math.random() * (48 + lesson.bubble.size * 160);
      spark.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      spark.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      spark.style.setProperty('--c', colors[i % colors.length]);
      spark.style.animationDelay = (Math.random() * 0.08) + 's';
      burst.appendChild(spark);
    }
    markers.appendChild(burst);
    window.setTimeout(function () { burst.remove(); }, 850);
  }

  function wait(ms) {
    return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
  }

  async function completeLesson() {
    if (busy || completed >= LESSONS.length) return;
    busy = true;
    btnComplete.disabled = true;
    btnReset.disabled = true;

    var idx = completed;
    var lesson = LESSONS[idx];
    var bubble = bubbleEls[idx];

    setStatus('Lesson ' + (idx + 1) + ' done — the wish glows…');
    bubble.classList.remove('is-locked');
    bubble.classList.add('is-ready');
    stoneEls[idx].classList.add('current');
    await wait(1200);

    setStatus('The wish pops into golden light.');
    bubble.classList.add('is-popping');
    spawnBurst(lesson);
    await wait(480);
    bubble.classList.remove('is-ready', 'is-popping');
    bubble.classList.add('is-popped');

    completed += 1;
    setProgress();
    stoneEls[idx].classList.remove('current');
    stoneEls[idx].classList.add('done');
    await wait(220);

    setStatus('Walking forward into the valley…');
    applyCamera(completed);
    placeTraveller(completed);
    await wait(1500);

    if (completed >= LESSONS.length) {
      doorGlow.classList.add('on');
      arrived.classList.add('show');
      setStatus('You reached the castle door. The crown is the final prize.');
      btnComplete.textContent = 'Journey complete';
      btnComplete.disabled = true;
    } else {
      setStatus('Next wish waits beside stone ' + (completed + 1) + '.');
      stoneEls[completed].classList.add('current');
      btnComplete.disabled = false;
      btnComplete.textContent = 'Complete lesson';
    }
    btnReset.disabled = false;
    busy = false;
  }

  function resetAll() {
    if (busy) return;
    completed = 0;
    arrived.classList.remove('show');
    doorGlow.classList.remove('on');
    btnComplete.disabled = false;
    btnComplete.textContent = 'Complete lesson';
    applyCamera(0);
    placeTraveller(0);
    refreshBubbleStates();
    setProgress();
    setStatus('Grey bubbles wait ahead. Complete a lesson to wake the next wish.');
  }

  buildMarkers();
  resetAll();
  btnComplete.addEventListener('click', completeLesson);
  btnReset.addEventListener('click', resetAll);
})();
  </script>
</body>
</html>
