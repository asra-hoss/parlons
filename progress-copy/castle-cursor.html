<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Castle Path — Wish Bubbles (Cursor prototype)</title>
  <style>
    :root {
      --ink: #1c2430;
      --panel: rgba(255, 252, 247, 0.92);
      --accent: #c47a1a;
      --accent-deep: #8a4f0c;
      --good: #2f7a4a;
      --muted: #5a6573;
      --bubble-grey: #9aa3ad;
      --gold: #f0c14a;
      --gold-bright: #ffe9a0;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0e1520;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header.bar {
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(14,21,32,.72), rgba(14,21,32,.28));
      color: #f7f1e6;
      backdrop-filter: blur(8px);
    }
    header.bar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    header.bar p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: 0.85;
    }
    .pill {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .stage-wrap {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 50% 0%, #3a5478 0%, transparent 55%),
        linear-gradient(180deg, #1a2a3d, #0e1520 70%);
      overflow: hidden;
    }

    .viewport {
      /* Exact artwork aspect so object-fit never crops the crown */
      --art-w: 1136;
      --art-h: 2080;
      position: relative;
      width: min(100%, calc(100vh * (var(--art-w) / var(--art-h))), 420px);
      aspect-ratio: 1136 / 2080;
      height: auto;
      max-height: 100%;
      overflow: hidden;
      border-radius: 0;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      background: #0b1220;
      isolation: isolate;
    }

    .scene {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
      transition: transform 1.35s cubic-bezier(0.22, 0.61, 0.26, 1);
    }

    .scene.is-moving {
      transition: transform 1.35s cubic-bezier(0.22, 0.61, 0.26, 1);
    }

    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Numbered lesson stones */
    .stone {
      position: absolute;
      width: 7.2%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: clamp(10px, 2.6vw, 14px);
      color: #f8f4ec;
      background:
        radial-gradient(circle at 35% 30%, #8d939c, #5c646e 62%, #3e454e);
      border: 1.5px solid rgba(255,255,255,.35);
      box-shadow:
        0 2px 0 rgba(0,0,0,.35),
        0 6px 14px rgba(0,0,0,.28);
      transform: translate(-50%, -50%);
      transition: transform .35s ease, box-shadow .35s ease, background .35s ease;
    }
    .stone.done {
      background:
        radial-gradient(circle at 35% 30%, #e0c07a, #b8872e 62%, #6e4a16);
      box-shadow:
        0 0 0 2px rgba(255, 214, 120, .55),
        0 6px 16px rgba(180, 120, 20, .35);
    }
    .stone.current {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow:
        0 0 0 3px rgba(255, 232, 170, .75),
        0 8px 20px rgba(0,0,0,.35);
    }

    /* Wish bubbles */
    .bubble {
      position: absolute;
      width: var(--size, 9%);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .bubble .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      transition:
        filter .55s ease,
        background .55s ease,
        box-shadow .55s ease,
        opacity .45s ease,
        transform .55s ease;
    }

    /* Locked: grey / dull — opaque enough to mute the painted bubble beneath */
    .bubble.is-locked .orb {
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 40%),
        radial-gradient(circle at 50% 58%, rgba(190,198,206,.78), rgba(120,128,138,.88) 55%, rgba(78,86,96,.92));
      border: 1.5px solid rgba(220,226,232,.55);
      box-shadow:
        inset 0 0 14px rgba(255,255,255,.22),
        0 4px 12px rgba(0,0,0,.22);
      filter: grayscale(1) saturate(0.15) brightness(0.95);
    }
    .bubble.is-locked .star {
      opacity: 0.22;
      filter: grayscale(1);
    }

    /* Ready: colourful + glowing */
    .bubble.is-ready .orb {
      background:
        radial-gradient(circle at 30% 26%, rgba(255,255,255,.7), transparent 36%),
        radial-gradient(circle at 70% 70%, rgba(255,186,120,.35), transparent 45%),
        radial-gradient(circle at 50% 55%, rgba(255, 230, 160, .55), rgba(180, 220, 255, .22) 48%, rgba(255,170,210,.18) 72%, rgba(120,170,220,.28));
      border: 1.5px solid rgba(255,255,255,.55);
      box-shadow:
        0 0 18px rgba(255, 210, 110, .75),
        0 0 36px rgba(255, 180, 80, .35),
        inset 0 0 14px rgba(255,255,255,.35);
      filter: none;
      animation: bubblePulse 1.1s ease-in-out infinite;
    }
    .bubble.is-ready .star {
      opacity: 1;
      filter: none;
      animation: starTwinkle .9s ease-in-out infinite;
    }

    .bubble.is-popping .orb {
      animation: none;
      opacity: 0;
      transform: scale(1.35);
      filter: brightness(2);
      transition: opacity .28s ease, transform .28s ease, filter .28s ease;
    }
    .bubble.is-popped {
      opacity: 0;
      visibility: hidden;
    }

    .star {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 34%;
      height: 34%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, #fff 0 18%, transparent 19%),
        linear-gradient(90deg, transparent 44%, #ffe9a0 44% 56%, transparent 56%),
        linear-gradient(0deg, transparent 44%, #ffe9a0 44% 56%, transparent 56%),
        linear-gradient(45deg, transparent 46%, rgba(255,240,180,.9) 46% 54%, transparent 54%),
        linear-gradient(-45deg, transparent 46%, rgba(255,240,180,.9) 46% 54%, transparent 54%);
      filter: drop-shadow(0 0 4px rgba(255, 210, 100, .9));
      transition: opacity .4s ease, filter .4s ease;
    }

    @keyframes bubblePulse {
      0%, 100% { box-shadow: 0 0 16px rgba(255,210,110,.7), 0 0 28px rgba(255,180,80,.28), inset 0 0 12px rgba(255,255,255,.3); }
      50% { box-shadow: 0 0 26px rgba(255,220,130,.95), 0 0 42px rgba(255,190,90,.45), inset 0 0 16px rgba(255,255,255,.45); }
    }
    @keyframes starTwinkle {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.18); opacity: .85; }
    }

    /* Pop burst: golden light + sparkles (no sound) */
    .burst {
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
      z-index: 8;
      transform: translate(-50%, -50%);
    }
    .burst .flash {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      background: radial-gradient(circle, #fff 0%, #ffe08a 35%, rgba(255,180,60,0) 70%);
      animation: flashPop .55s ease-out forwards;
    }
    .burst .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      margin: -2.5px;
      border-radius: 50%;
      background: var(--c, #ffe9a0);
      box-shadow: 0 0 6px var(--c, #ffe9a0);
      animation: sparkFly .7s ease-out forwards;
      --dx: 0px;
      --dy: 0px;
    }
    .burst .spark.starry {
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background: #ffe9a0;
    }

    @keyframes flashPop {
      0% { transform: translate(-50%, -50%) scale(0.15); opacity: 1; }
      55% { transform: translate(-50%, -50%) scale(4.2); opacity: .85; }
      100% { transform: translate(-50%, -50%) scale(6.5); opacity: 0; }
    }
    @keyframes sparkFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.15); opacity: 0; }
    }

    .traveller {
      position: absolute;
      width: 4.8%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 35% 30%, #fff6df, #f0c14a 45%, #b7791f 100%);
      border: 2px solid rgba(255,255,255,.85);
      box-shadow:
        0 0 0 3px rgba(240, 193, 74, .35),
        0 6px 14px rgba(0,0,0,.35);
      z-index: 6;
      transition: left 1.35s cubic-bezier(0.22, 0.61, 0.26, 1),
                  top 1.35s cubic-bezier(0.22, 0.61, 0.26, 1),
                  transform 1.35s cubic-bezier(0.22, 0.61, 0.26, 1);
    }
    .traveller::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 110%;
      width: 70%;
      height: 35%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0,0,0,.28), transparent 70%);
    }

    .door-glow {
      position: absolute;
      left: 50%;
      top: 19.5%;
      width: 10%;
      height: 6%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,120,.55), transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease, transform .8s ease;
      filter: blur(2px);
    }
    .door-glow.on {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.6);
    }

    footer.controls {
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(14,21,32,.88), rgba(14,21,32,.45));
      backdrop-filter: blur(8px);
      color: #f7f1e6;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 18px;
      transition: transform .15s ease, opacity .15s ease, background .2s ease;
    }
    button:active { transform: translateY(1px) scale(0.98); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, #f0c14a, #c47a1a);
      color: #1c1406;
      box-shadow: 0 6px 16px rgba(196, 122, 26, .35);
      min-width: 168px;
    }
    .btn-ghost {
      background: rgba(255,255,255,.1);
      color: #f7f1e6;
      border: 1px solid rgba(255,255,255,.18);
    }

    .status {
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: rgba(247,241,230,.82);
      min-height: 1.2em;
    }

    .arrived {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px 18px;
      background: linear-gradient(0deg, rgba(8,12,20,.55), transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease;
      z-index: 12;
    }
    .arrived.show { opacity: 1; }
    .arrived .card {
      background: var(--panel);
      color: var(--ink);
      padding: 14px 18px;
      border-radius: 14px;
      text-align: center;
      max-width: 260px;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      transform: translateY(10px);
      transition: transform .5s ease;
    }
    .arrived.show .card { transform: translateY(0); }
    .arrived h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .arrived p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div>
        <h1>Castle Path</h1>
        <p>Wish bubbles · Cursor prototype</p>
      </div>
      <div class="pill" id="progressPill">Lesson 0 / 8</div>
    </header>

    <div class="stage-wrap">
      <div class="viewport" id="viewport" aria-label="Path to the castle">
        <div class="scene" id="scene">
          <img
            class="art"
            src="./castle-bubbles.webp"
            alt="Autumn valley path winding up to a castle with a glowing crown, wish bubbles beside the path"
            draggable="false"
          />
          <div class="overlay" id="overlay"></div>
          <div class="door-glow" id="doorGlow"></div>
          <div class="traveller" id="traveller" title="You"></div>
        </div>
        <div class="arrived" id="arrived">
          <div class="card">
            <h2>Castle door</h2>
            <p>You reached the end of the level. The crown is yours.</p>
          </div>
        </div>
      </div>
    </div>

    <footer class="controls">
      <button type="button" class="btn-primary" id="btnComplete">Complete lesson</button>
      <button type="button" class="btn-ghost" id="btnReset">Reset</button>
      <div class="status" id="status">Grey bubbles wait ahead. Complete a lesson to wake the next wish.</div>
    </footer>
  </div>

  <script>
(function () {
  'use strict';

  /**
   * Lesson markers along the stone path (image-normalized coords).
   * Bubbles float beside each stone.
   *
   * Camera: top-anchored forward walk. Transform origin stays at the top of
   * the artwork (crown), scale grows so the castle enlarges while foreground
   * stones pass out the bottom — not a center-zoom that crops the crown.
   */
  var LESSONS = [
    { stone: { x: 0.50, y: 0.90 }, bubble: { x: 0.72, y: 0.87, size: 0.145 }, pathX: 0.00 },
    { stone: { x: 0.54, y: 0.78 }, bubble: { x: 0.80, y: 0.76, size: 0.125 }, pathX: -0.012 },
    { stone: { x: 0.46, y: 0.68 }, bubble: { x: 0.22, y: 0.69, size: 0.105 }, pathX: 0.010 },
    { stone: { x: 0.52, y: 0.58 }, bubble: { x: 0.70, y: 0.56, size: 0.095 }, pathX: -0.008 },
    { stone: { x: 0.48, y: 0.48 }, bubble: { x: 0.26, y: 0.49, size: 0.085 }, pathX: 0.006 },
    { stone: { x: 0.51, y: 0.39 }, bubble: { x: 0.66, y: 0.38, size: 0.075 }, pathX: -0.004 },
    { stone: { x: 0.49, y: 0.31 }, bubble: { x: 0.34, y: 0.305, size: 0.065 }, pathX: 0.002 },
    { stone: { x: 0.50, y: 0.24 }, bubble: { x: 0.58, y: 0.235, size: 0.055 }, pathX: 0.000 }
  ];

  // How much of the image height remains in view at each camera index
  // (0 = start / full scene, LESSONS.length = door). Crown stays in frame
  // because we always keep the top of the artwork and only advance the floor.
  var VIEW_BOTTOM = [1.00, 0.90, 0.80, 0.71, 0.63, 0.56, 0.50, 0.45, 0.40];

  var scene = document.getElementById('scene');
  var overlay = document.getElementById('overlay');
  var traveller = document.getElementById('traveller');
  var doorGlow = document.getElementById('doorGlow');
  var arrived = document.getElementById('arrived');
  var btnComplete = document.getElementById('btnComplete');
  var btnReset = document.getElementById('btnReset');
  var statusEl = document.getElementById('status');
  var progressPill = document.getElementById('progressPill');

  var completed = 0;
  var busy = false;
  var bubbleEls = [];
  var stoneEls = [];

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setProgress() {
    progressPill.textContent = 'Lesson ' + completed + ' / ' + LESSONS.length;
  }

  function cameraForStep(stepIndex) {
    var i = Math.max(0, Math.min(stepIndex, VIEW_BOTTOM.length - 1));
    var visible = VIEW_BOTTOM[i];
    var scale = 1 / visible;
    var pathX = 0;
    if (stepIndex <= 0) pathX = LESSONS[0].pathX;
    else if (stepIndex >= LESSONS.length) pathX = 0;
    else pathX = LESSONS[stepIndex].pathX;
    return { scale: scale, x: pathX };
  }

  function applyCamera(cam) {
    // Origin at top-center: crown stays put and grows; path rushes underfoot.
    scene.style.transformOrigin = '50% 0%';
    scene.style.transform =
      'translateX(' + (cam.x * 100) + '%) scale(' + cam.scale + ')';
  }

  function placeTraveller(stepIndex) {
    var pt;
    if (stepIndex <= 0) {
      pt = { x: 0.50, y: 0.96 };
    } else if (stepIndex >= LESSONS.length) {
      pt = { x: 0.50, y: 0.205 };
    } else {
      pt = LESSONS[stepIndex - 1].stone;
    }
    traveller.style.left = (pt.x * 100) + '%';
    traveller.style.top = (pt.y * 100) + '%';
  }

  function buildMarkers() {
    overlay.innerHTML = '';
    bubbleEls = [];
    stoneEls = [];

    LESSONS.forEach(function (lesson, i) {
      var stone = document.createElement('div');
      stone.className = 'stone';
      stone.textContent = String(i + 1);
      stone.style.left = (lesson.stone.x * 100) + '%';
      stone.style.top = (lesson.stone.y * 100) + '%';
      overlay.appendChild(stone);
      stoneEls.push(stone);

      var bubble = document.createElement('div');
      bubble.className = 'bubble is-locked';
      bubble.style.left = (lesson.bubble.x * 100) + '%';
      bubble.style.top = (lesson.bubble.y * 100) + '%';
      bubble.style.setProperty('--size', (lesson.bubble.size * 100) + '%');
      bubble.innerHTML = '<div class="orb"></div><div class="star"></div>';
      overlay.appendChild(bubble);
      bubbleEls.push(bubble);
    });
  }

  function refreshBubbleStates() {
    bubbleEls.forEach(function (el, i) {
      el.classList.remove('is-locked', 'is-ready', 'is-popping', 'is-popped');
      if (i < completed) {
        el.classList.add('is-popped');
      } else {
        el.classList.add('is-locked');
      }
    });
    stoneEls.forEach(function (el, i) {
      el.classList.remove('done', 'current');
      if (i < completed) el.classList.add('done');
      else if (i === completed && completed < LESSONS.length) el.classList.add('current');
    });
  }

  function spawnBurst(nx, ny, sizeFrac) {
    var burst = document.createElement('div');
    burst.className = 'burst';
    burst.style.left = (nx * 100) + '%';
    burst.style.top = (ny * 100) + '%';

    var flash = document.createElement('div');
    flash.className = 'flash';
    flash.style.width = Math.round(56 + sizeFrac * 280) + 'px';
    flash.style.height = flash.style.width;
    burst.appendChild(flash);

    var colors = ['#fff6c8', '#ffe08a', '#ffd060', '#fff', '#f0c14a', '#ffb347'];
    var count = 22;
    for (var i = 0; i < count; i++) {
      var spark = document.createElement('div');
      spark.className = 'spark' + (i % 3 === 0 ? ' starry' : '');
      var ang = (Math.PI * 2 * i) / count + (Math.random() * 0.35);
      var dist = 36 + Math.random() * (48 + sizeFrac * 160);
      spark.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      spark.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      spark.style.setProperty('--c', colors[i % colors.length]);
      spark.style.animationDelay = (Math.random() * 0.08) + 's';
      burst.appendChild(spark);
    }

    overlay.appendChild(burst);
    window.setTimeout(function () {
      burst.remove();
    }, 800);
  }

  function wait(ms) {
    return new Promise(function (resolve) {
      window.setTimeout(resolve, ms);
    });
  }

  async function completeLesson() {
    if (busy) return;
    if (completed >= LESSONS.length) return;

    busy = true;
    btnComplete.disabled = true;
    btnReset.disabled = true;

    var idx = completed;
    var lesson = LESSONS[idx];
    var bubble = bubbleEls[idx];

    setStatus('Lesson ' + (idx + 1) + ' done — the wish glows…');
    bubble.classList.remove('is-locked');
    bubble.classList.add('is-ready');
    stoneEls[idx].classList.add('current');

    // Hold the colourful glow long enough to read clearly, then self-pop.
    await wait(1200);

    setStatus('The wish pops into golden light.');
    bubble.classList.add('is-popping');
    spawnBurst(lesson.bubble.x, lesson.bubble.y, lesson.bubble.size);
    await wait(480);
    bubble.classList.remove('is-ready', 'is-popping');
    bubble.classList.add('is-popped');

    completed += 1;
    setProgress();
    stoneEls[idx].classList.remove('current');
    stoneEls[idx].classList.add('done');

    await wait(220);

    // True forward step: viewpoint walks toward the castle (not a center zoom).
    setStatus('Stepping forward along the path…');
    scene.classList.add('is-moving');
    applyCamera(cameraForStep(completed));
    placeTraveller(completed);

    await wait(1400);

    if (completed >= LESSONS.length) {
      doorGlow.classList.add('on');
      arrived.classList.add('show');
      setStatus('You reached the castle door. The crown is the final prize.');
      btnComplete.textContent = 'Journey complete';
      btnComplete.disabled = true;
    } else {
      setStatus('Next wish waits beside stone ' + (completed + 1) + '.');
      stoneEls[completed].classList.add('current');
      btnComplete.disabled = false;
      btnComplete.textContent = 'Complete lesson';
    }

    btnReset.disabled = false;
    busy = false;
  }

  function resetAll() {
    if (busy) return;
    completed = 0;
    arrived.classList.remove('show');
    doorGlow.classList.remove('on');
    btnComplete.disabled = false;
    btnComplete.textContent = 'Complete lesson';
    applyCamera(cameraForStep(0));
    placeTraveller(0);
    refreshBubbleStates();
    setProgress();
    setStatus('Grey bubbles wait ahead. Complete a lesson to wake the next wish.');
  }

  buildMarkers();
  resetAll();

  btnComplete.addEventListener('click', function () {
    completeLesson();
  });
  btnReset.addEventListener('click', resetAll);
})();
  </script>
</body>
</html>
