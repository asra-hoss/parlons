<head>

<title>My Collection — Chichilang</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b2350; --gold:#ffc93c; --gold2:#f5a623; --green:#58cc02; --green2:#46a302;
  --A1:#12b5a5; --A2:#3d9df5; --B1:#8b5cf6; --B2:#ef5da8; --C1:#ff922b; --C2:#f43f5e;
}
body{font-family:'Nunito',sans-serif;color:#fff;max-width:520px;margin:0 auto;padding:0 14px 56px;min-height:100vh;
  background:
    radial-gradient(circle at 12% 22%, rgba(255,255,255,.20) 0 2px, transparent 3px),
    radial-gradient(circle at 84% 12%, rgba(255,255,255,.16) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 38%, rgba(255,255,255,.12) 0 2px, transparent 3px),
    radial-gradient(circle at 26% 55%, rgba(255,255,255,.12) 0 2px, transparent 3px),
    radial-gradient(circle at 90% 64%, rgba(255,255,255,.14) 0 2px, transparent 3px),
    linear-gradient(180deg,#241457 0%,#3b1d8f 55%,#4c26a8 100%);
  background-attachment:fixed}
h1,h2,.fr{font-family:'Fredoka',sans-serif}
.plaque{margin:22px auto 0;width:fit-content;max-width:92%;text-align:center;
  background:linear-gradient(180deg,#ffe066,#ffc93c 55%,#f5a623);
  border:4px solid #fff3c4;border-radius:20px;padding:10px 34px;
  box-shadow:0 8px 0 #b97e10,0 16px 30px rgba(0,0,0,.35)}
.plaque h1{color:#7a4a00;font-size:32px;font-weight:700;letter-spacing:.01em;text-shadow:0 2px 0 rgba(255,255,255,.45)}
.topbar{display:flex;align-items:center;gap:10px;margin-top:20px}
.pbar{flex:1;height:34px;background:#1c0e46;border:3px solid var(--gold);border-radius:99px;position:relative;overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.pbar i{position:absolute;inset:0;width:0%;background:linear-gradient(180deg,#7ee82e,#58cc02 60%,#46a302);border-radius:99px;transition:width .5s}
.pbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-size:17px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45);letter-spacing:.03em}
.coinpill{flex:none;display:flex;align-items:center;gap:7px;background:#1c0e46;border:3px solid var(--gold);border-radius:99px;padding:4px 14px 4px 6px;font-family:'Fredoka';font-weight:700;font-size:17px}
.coinpill img{width:26px;height:26px}
.search{position:relative;margin-top:14px}
.search input{width:100%;border:3px solid var(--gold);background:#fffdf4;border-radius:99px;padding:13px 18px 13px 46px;font-family:'Nunito';font-weight:800;font-size:16px;color:var(--ink);outline:none;box-shadow:0 8px 20px rgba(0,0,0,.30)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#b97e10}
.view{display:none}.view.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;margin-top:24px}
.med{cursor:pointer;text-align:center}
.med:active{transform:scale(.97)}
.med .ring{width:100%;aspect-ratio:1;border-radius:50%;padding:5px;background:linear-gradient(180deg,#ffe066,#f5a623);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.med .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid rgba(255,255,255,.65)}
.med .plate{margin:-14px auto 0;position:relative;width:96%;border-radius:12px;padding:7px 4px 6px;color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.30);border:2px solid rgba(255,255,255,.5)}
.med .plate .a{font-family:'Fredoka';font-weight:700;font-size:16px;line-height:1.1}
.med .plate .b{font-family:'Fredoka';font-weight:600;font-size:12.5px;line-height:1.15;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.med .mark{margin-top:7px;height:30px;display:flex;align-items:center;justify-content:center}
.med .chk{font-size:30px;color:var(--green);font-weight:900;text-shadow:0 2px 0 #2f7a01,0 4px 10px rgba(0,0,0,.35);line-height:1}
.med .chip{background:linear-gradient(180deg,#7ee82e,#58cc02);border:2px solid #d9ffb0;color:#fff;font-family:'Fredoka';font-weight:700;font-size:14px;border-radius:99px;padding:3px 14px;box-shadow:0 4px 0 #46a302}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;background:linear-gradient(180deg,#ffe066,#f5a623);border:3px solid #fff3c4;color:#7a4a00;font-family:'Fredoka';font-weight:700;font-size:15px;border-radius:99px;padding:8px 18px;cursor:pointer;box-shadow:0 5px 0 #b97e10}
.vtitle{font-family:'Fredoka';font-weight:700;font-size:27px;margin-top:16px;text-shadow:0 3px 8px rgba(0,0,0,.4)}
.vsub{font-weight:800;font-size:14px;color:#cfc4ff;margin-top:2px}
.board{margin-top:18px;border-radius:26px;padding:10px;background:linear-gradient(180deg,#ffe066,#f5a623);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.board .in{background:#fdf6e0;border-radius:20px;padding:16px 12px 20px;position:relative}
.board .banner{margin:-16px -12px 14px;border-radius:20px 20px 0 0;padding:16px 44px 14px 16px;color:#fff;position:relative}
.board .banner .t{font-family:'Fredoka';font-weight:700;font-size:23px;text-shadow:0 2px 4px rgba(0,0,0,.25)}
.board .banner .s{font-weight:800;font-size:13px;opacity:.92}
.board .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#e5322d 70%);border:3px solid #ffb3ab;color:#fff;font-family:'Fredoka';font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #a1160f;display:flex;align-items:center;justify-content:center}
.board .pbar{border-color:#e8b23a;height:30px;background:#e9dfc2;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.board .pbar b{font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.lcard{cursor:pointer;position:relative;background:#fff;border-radius:16px;padding:5px;box-shadow:0 0 0 3px #d8d2c4,0 8px 16px rgba(90,70,20,.18)}
.lcard:active{transform:scale(.97)}
.lcard .pic{border-radius:11px;overflow:hidden;aspect-ratio:1/1.02;background:#eee}
.lcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .nm{margin-top:5px;border-radius:10px;color:#fff;font-family:'Fredoka';font-weight:600;font-size:12px;line-height:1.2;text-align:center;padding:6px 3px;min-height:3.1em;display:flex;align-items:center;justify-content:center}
.lcard .star{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:24px;color:var(--gold);text-shadow:0 2px 0 #b97e10,0 3px 6px rgba(0,0,0,.3);z-index:2;line-height:1}
.lcard .rib{position:absolute;top:12px;left:-4px;z-index:2;background:linear-gradient(180deg,#b18cff,#7c5cff);color:#fff;font-family:'Fredoka';font-weight:700;font-size:10.5px;border-radius:0 99px 99px 0;padding:3px 9px 3px 7px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.lcard.miss{background:#efece2;box-shadow:0 0 0 3px #ddd8c8}
.lcard.miss .pic img{filter:grayscale(1) brightness(1.75) contrast(.8);opacity:.38}
.lcard.miss .nm{background:#ddd8c8!important;color:#a39c88}
.lcard.miss .star{color:#cfc9b8;text-shadow:none}
.res{display:flex;align-items:center;gap:12px;background:#fffdf4;border-radius:18px;padding:12px 14px;margin-top:10px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);color:var(--ink)}
.res .rl{flex:none;font-family:'Fredoka';font-weight:700;font-size:13px;color:#fff;border-radius:10px;padding:5px 9px}
.res .rt{flex:1;min-width:0}
.res .rt .a{font-family:'Fredoka';font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rt .b{color:#8a84ad;font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .st{flex:none;font-weight:900;font-size:13px}
.empty{text-align:center;color:#cfc4ff;font-weight:800;padding:36px 10px;font-size:15px}
</style>
</head>

 "/assets/c12-unit-7-0zmbqghq.jpg"}, {"n": 130, "lv": "C1", "dos": "Langue, discours, écriture", "t": "Les connecteurs formels", "goal": "Connect ideas formally and quote sources accurately in writing", "dir": "lesson-c1-new-connecteurs", "key": "v5-new-130", "cov": "/assets/c1-connecteurs-cover.jpg"}, {"n": 114, "lv": "C1", "dos": "Langue, discours, écriture", "t": "Les négations", "goal": "Master the complete negation system", "dir": "lesson-c1-new-negations", "key": "v3-c12-c2-01", "cov": "/assets/c12-unit-7-0zmbqghq.jpg"}, {"n": 115, "lv": "C2", "dos": "Résumer et nuancer", "t": "Résumer et reformuler", "goal": "Summarise and reconstruct arguments", "dir": "lesson-c12-c2-01", "key": "v3-c12-c2-01", "cov": "/assets/c12-unit-8-srw4nhsj.jpg"}, {"n": 116, "lv": "C2", "dos": "Résumer et nuancer", "t": "Les nuances", "goal": "Fine shades of meaning", "dir": "lesson-c12-c2-02", "key": "v3-c12-c2-02", "cov": "/assets/c12-unit-8-srw4nhsj.jpg"}, {"n": 117, "lv": "C2", "dos": "Résumer et nuancer", "t": "Penser de façon critique", "goal": "Critical thinking and philosophy", "dir": "lesson-c12-c2-03", "key": "v3-c12-c2-03", "cov": "/assets/c12-unit-8-srw4nhsj.jpg"}, {"n": 118, "lv": "C2", "dos": "Monde et textes", "t": "Politique internationale", "goal": "Politics and international affairs", "dir": "lesson-c12-c2-04", "key": "v3-c12-c2-04", "cov": "/assets/c12-unit-9-6sqtca7c.jpg"}, {"n": 119, "lv": "C2", "dos": "Monde et textes", "t": "Littérature et textes classiques", "goal": "Literature and classic texts", "dir": "lesson-c12-c2-05", "key": "v3-c12-c2-05", "cov": "/assets/c12-unit-9-6sqtca7c.jpg"}, {"n": 120, "lv": "C2", "dos": "Monde et textes", "t": "Domaines spécialisés", "goal": "Specialised and academic domains", "dir": "lesson-c12-c2-06", "key": "v3-c12-c2-06", "cov": "/assets/c12-unit-9-6sqtca7c.jpg"}, {"n": 121, "lv": "C2", "dos": "Style et oral", "t": "Maîtriser le style", "goal": "Mastery of style and register", "dir": "lesson-c12-c2-07", "key": "v3-c12-c2-07", "cov": "/assets/c12-unit-10-eg187ykx.jpg"}, {"n": 122, "lv": "C2", "dos": "Style et oral", "t": "Parler longuement", "goal": "Extended speaking", "dir": "lesson-c12-c2-08", "key": "v3-c12-c2-08", "cov": "/assets/c12-unit-10-eg187ykx.jpg"}, {"n": 123, "lv": "C2", "dos": "Écrire, comprendre, bilan", "t": "Écrire longuement", "goal": "Extended writing", "dir": "lesson-c12-c2-09", "key": "v3-c12-c2-09", "cov": "/assets/c12-unit-11-yvb2bka7.jpg"}, {"n": 124, "lv": "C2", "dos": "Écrire, comprendre, bilan", "t": "Tout comprendre", "goal": "Understand everything", "dir": "lesson-c12-c2-10", "key": "v3-c12-c2-10", "cov": "/assets/c12-unit-11-yvb2bka7.jpg"}, {"n": 125, "lv": "C2", "dos": "Écrire, comprendre, bilan", "t": "Bilan C2", "goal": "Review and DALF C2 practice", "dir": "lesson-c12-c2-11", "key": "v3-c12-c2-11", "cov": "/assets/c12-unit-11-yvb2bka7.jpg"}];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const LNAME = {A1:"Beginner",A2:"Elementary",B1:"Intermediate",B2:"Upper intermediate",C1:"Advanced",C2:"Mastery"};
const LCOL = {A1:"#12b5a5",A2:"#3d9df5",B1:"#8b5cf6",B2:"#ef5da8",C1:"#ff922b",C2:"#f43f5e"};
let PROG = {};
try{ PROG = JSON.parse(localStorage.getItem('cam_prog')||'{}'); }catch(e){}
let COINS = 0;
try{ COINS = (JSON.parse(localStorage.getItem('parlons:stars')||'{}').balance)||0; }catch(e){}
function state(l){
  const r = PROG[l.key];
  if(r && r.done) return 2;
  if(r && r.steps && Object.keys(r.steps).length) return 1;
  return 0;
}
DATA.forEach(l=>l.st = state(l));
const byLv = lv => DATA.filter(l=>l.lv===lv);
const dossiers = lv => { const m = new Map(); byLv(lv).forEach(l=>{ if(!m.has(l.dos)) m.set(l.dos,[]); m.get(l.dos).push(l); }); return [...m.entries()].map(([name,ls])=>({name, ls})); };
const got = ls => ls.filter(l=>l.st===2).length;
function mark(ls){
  const g = got(ls);
  return g===ls.length ? '<div class="chk">✓</div>' : '<div class="chip">'+g+'/'+ls.length+'</div>';
}
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0});
}
function renderHome(){
  const tot = DATA.length, g = got(DATA);
  document.getElementById('obarfill').style.width = (100*g/tot) + '%';
  document.getElementById('obartext').textContent = g + ' / ' + tot;
  document.getElementById('coins').textContent = COINS;
  document.getElementById('v-home').innerHTML = '<div class="mgrid">' + LEVELS.map(lv=>{
    const ls = byLv(lv), cov = ls[0].cov;
    return '<div class="med" data-lv="'+lv+'">'
      + '<div class="ring"><img src="'+cov+'" alt=""></div>'
      + '<div class="plate" style="background:'+LCOL[lv]+'"><div class="a">'+lv+'</div><div class="b">'+LNAME[lv]+'</div></div>'
      + '<div class="mark">'+mark(ls)+'</div></div>';
  }).join('') + '</div>';
  document.querySelectorAll('.med').forEach(w=>w.onclick=()=>{ renderLevel(w.dataset.lv); show('v-level'); });
}
function renderLevel(lv){
  const ds = dossiers(lv), ls = byLv(lv);
  document.getElementById('v-level').innerHTML =
    '<button class="back" id="bk1">‹ All levels</button>'
    + '<div class="vtitle">Level '+lv+' — '+LNAME[lv]+'</div>'
    + '<div class="vsub">'+ds.length+' dossiers · '+got(ls)+' of '+ls.length+' lessons collected</div>'
    + '<div class="mgrid">' + ds.map((d,i)=>
        '<div class="med" data-d="'+i+'">'
        + '<div class="ring"><img src="'+d.ls[0].cov+'" alt=""></div>'
        + '<div class="plate" style="background:'+LCOL[lv]+'"><div class="b" style="font-size:13.5px;-webkit-line-clamp:2">'+d.name+'</div></div>'
        + '<div class="mark">'+mark(d.ls)+'</div></div>'
      ).join('') + '</div>';
  document.getElementById('bk1').onclick=()=>{ renderHome(); show('v-home'); };
  document.querySelectorAll('#v-level .med').forEach(p=>p.onclick=()=>{ renderDos(lv, ds[+p.dataset.d]); show('v-dos'); });
}
function renderDos(lv, d){
  const g = got(d.ls);
  document.getElementById('v-dos').innerHTML =
    '<div class="board"><div class="in">'
    + '<div class="banner" style="background:'+LCOL[lv]+'"><div class="t">'+d.name+'</div><div class="s">Level '+lv+' · '+d.ls.length+' lessons</div><div class="x" id="bk2">✕</div></div>'
    + '<div class="pbar"><i style="width:'+(100*g/d.ls.length)+'%"></i><b>'+g+' / '+d.ls.length+'</b></div>'
    + '<div class="cgrid" style="margin-top:22px">' + d.ls.map(l=>{
        const cls = l.st===0 ? 'lcard miss' : 'lcard';
        const rib = l.st===1 ? '<div class="rib">Started</div>' : '';
        const star = l.st===0 ? '★' : (l.st===2 ? '★' : '');
        return '<div class="'+cls+'" data-dir="'+l.dir+'">'
          + (star ? '<div class="star">'+star+'</div>' : '') + rib
          + '<div class="pic"><img src="'+l.cov+'" alt=""></div>'
          + '<div class="nm" style="background:'+LCOL[lv]+'">'+l.t+'</div></div>';
      }).join('') + '</div>'
    + '</div></div>';
  document.getElementById('bk2').onclick=()=>{ renderLevel(lv); show('v-level'); };
  document.querySelectorAll('#v-dos .lcard').forEach(c=>c.onclick=()=>{ location.href='/'+c.dataset.dir+'/'; });
}
const q = document.getElementById('q');
q.addEventListener('input', ()=>{
  const s = q.value.trim().toLowerCase();
  if(!s){ show('v-home'); return; }
  const hits = DATA.filter(l => l.t.toLowerCase().includes(s) || l.dos.toLowerCase().includes(s) || l.goal.toLowerCase().includes(s) || l.lv.toLowerCase()===s);
  document.getElementById('v-search').innerHTML =
    '<div class="vtitle">Search</div><div class="vsub">'+hits.length+' result'+(hits.length===1?'':'s')+'</div>'
    + (hits.length ? hits.map(l=>
        '<div class="res" data-dir="'+l.dir+'"><div class="rl" style="background:'+LCOL[l.lv]+'">'+l.lv+'</div>'
        + '<div class="rt"><div class="a">'+l.t+'</div><div class="b">'+l.dos+' · '+l.goal+'</div></div>'
        + '<div class="st" style="color:'+(l.st===2 ? '#46a302' : (l.st===1 ? '#7c5cff' : '#b3aed2'))+'">'+(l.st===2 ? '✓ Collected' : (l.st===1 ? 'In progress' : 'Not started'))+'</div></div>'
      ).join('') : '<div class="empty">Nothing matches that search yet.</div>');
  document.querySelectorAll('#v-search .res').forEach(r=>r.onclick=()=>{ location.href='/'+r.dataset.dir+'/'; });
  show('v-search');
});
renderHome();
</script>
