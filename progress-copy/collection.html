<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Collection — Chichilang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b2350; --mut:#8a84ad; --bg:#f2efff; --card:#ffffff;
  --acc:#7c5cff; --gold:#ffb020;
  --A1:#12b5a5; --A2:#3d9df5; --B1:#8b5cf6; --B2:#ef5da8; --C1:#ff922b; --C2:#f43f5e;
}
html,body{background:var(--bg)}
body{font-family:'Nunito',sans-serif;color:var(--ink);max-width:520px;margin:0 auto;padding:0 16px 48px;min-height:100vh}
h1,h2,h3,.fr{font-family:'Fredoka',sans-serif}
header{padding:26px 2px 6px;text-align:center}
header .kick{font-size:12px;font-weight:900;letter-spacing:.22em;color:var(--acc);text-transform:uppercase}
header h1{font-size:34px;font-weight:700;margin-top:2px}
header .sub{color:var(--mut);font-weight:800;font-size:14px;margin-top:4px}
.obar{height:12px;background:#e3ddfb;border-radius:99px;margin:16px 2px 4px;overflow:hidden}
.obar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#b18cff);border-radius:99px;transition:width .5s}
.search{position:sticky;top:10px;z-index:5;margin:14px 0 6px}
.search input{width:100%;border:3px solid #e3ddfb;background:#fff;border-radius:18px;padding:14px 18px 14px 46px;font-family:'Nunito';font-weight:800;font-size:16px;color:var(--ink);outline:none;box-shadow:0 6px 18px rgba(80,60,180,.08)}
.search input:focus{border-color:var(--acc)}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut)}
.view{display:none}.view.on{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.win{background:var(--card);border-radius:24px;padding:10px 10px 16px;cursor:pointer;box-shadow:0 8px 22px rgba(80,60,180,.10);border:3px solid transparent;text-align:center;position:relative}
.win:active{transform:scale(.98)}
.win .bar{height:26px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:12px}
.win .bar b{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85}
.win .lv{font-family:'Fredoka';font-size:44px;font-weight:700;line-height:1}
.win .nm{font-weight:900;font-size:13px;color:var(--mut);margin-top:2px}
.win .cnt{font-weight:900;font-size:14px;margin-top:10px}
.win .pbar{height:9px;background:#eeeafd;border-radius:99px;margin:8px 6px 0;overflow:hidden}
.win .pbar i{display:block;height:100%;border-radius:99px}
.win .done{position:absolute;top:44px;right:12px;background:var(--gold);color:#fff;font-weight:900;font-size:12px;border-radius:99px;padding:3px 9px;box-shadow:0 4px 10px rgba(255,176,32,.5)}
.back{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid #e3ddfb;color:var(--ink);font-family:'Nunito';font-weight:900;font-size:15px;border-radius:99px;padding:9px 16px;cursor:pointer;margin-top:16px}
.vtitle{font-size:26px;font-weight:700;margin:14px 2px 2px}
.vsub{color:var(--mut);font-weight:800;font-size:14px;margin:0 2px 6px}
.pack{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px;margin-top:12px;cursor:pointer;box-shadow:0 6px 16px rgba(80,60,180,.08);border:3px solid transparent}
.pack:active{transform:scale(.99)}
.pack .dot{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fredoka';font-weight:700;font-size:19px}
.pack .inf{flex:1;min-width:0}
.pack .inf .t{font-family:'Fredoka';font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack .inf .c{color:var(--mut);font-weight:800;font-size:13px;margin-top:1px}
.pack .pbar{height:8px;background:#eeeafd;border-radius:99px;margin-top:8px;overflow:hidden}
.pack .pbar i{display:block;height:100%;border-radius:99px}
.pack .chk{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 4px 10px rgba(255,176,32,.45)}
.pack .chev{flex:none;color:#c9c2ea;font-weight:900;font-size:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.lcard{border-radius:20px;padding:16px 14px;min-height:118px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px}
.lcard .lt{font-family:'Fredoka';font-weight:600;font-size:17px;line-height:1.25}
.lcard .lg{font-size:12.5px;font-weight:700;line-height:1.35}
.lcard .badge{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
.lcard.got{background:#fff;box-shadow:0 6px 16px rgba(80,60,180,.10)}
.lcard.got .badge{background:var(--gold);color:#fff}
.lcard.got .lg{color:var(--mut)}
.lcard.mid{background:#fff;box-shadow:0 6px 16px rgba(80,60,180,.08)}
.lcard.mid .badge{background:#eeeafd;color:var(--acc);font-size:11px;width:auto;border-radius:99px;padding:4px 8px;height:auto}
.lcard.mid .lg{color:var(--mut)}
.lcard.miss{background:#e9e6f5;box-shadow:inset 0 0 0 2px #ddd8f2}
.lcard.miss .lt{color:#a49ec4}
.lcard.miss .lg{color:#b3aed2}
.lcard.miss .badge{background:#d5d0ec;color:#fff}
.res{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;margin-top:10px;cursor:pointer;box-shadow:0 5px 14px rgba(80,60,180,.07)}
.res .rl{flex:none;font-family:'Fredoka';font-weight:700;font-size:13px;color:#fff;border-radius:10px;padding:5px 9px}
.res .rt{flex:1;min-width:0}
.res .rt .a{font-family:'Fredoka';font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rt .b{color:var(--mut);font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .st{flex:none;font-weight:900;font-size:13px}
.empty{text-align:center;color:var(--mut);font-weight:800;padding:36px 10px;font-size:15px}
</style>
</head>

const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const LNAME = {A1:"Beginner",A2:"Elementary",B1:"Intermediate",B2:"Upper intermediate",C1:"Advanced",C2:"Mastery"};
const LCOL = {A1:"#12b5a5",A2:"#3d9df5",B1:"#8b5cf6",B2:"#ef5da8",C1:"#ff922b",C2:"#f43f5e"};
let PROG = {};
try{ PROG = JSON.parse(localStorage.getItem('cam_prog')||'{}'); }catch(e){}
function state(l){
  const r = PROG[l.key];
  if(r && r.done) return 2;
  if(r && r.steps && Object.keys(r.steps).length) return 1;
  return 0;
}
DATA.forEach(l=>l.st = state(l));
const byLv = lv => DATA.filter(l=>l.lv===lv);
const dossiers = lv => { const m = new Map(); byLv(lv).forEach(l=>{ if(!m.has(l.dos)) m.set(l.dos,[]); m.get(l.dos).push(l); }); return [...m.entries()].map(([name,ls])=>({name, ls})); };
const got = ls => ls.filter(l=>l.st===2).length;

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0});
}
function renderHome(){
  const tot = DATA.length, g = got(DATA);
  document.getElementById('totalsub').textContent = g + ' of ' + tot + ' lessons collected';
  document.getElementById('obarfill').style.width = (100*g/tot) + '%';
  document.getElementById('v-home').innerHTML = '<div class="grid">' + LEVELS.map(lv=>{
    const ls = byLv(lv), gg = got(ls), full = gg===ls.length;
    return '<div class="win" data-lv="'+lv+'">'
      + '<div class="bar" style="background:'+LCOL[lv]+'"><b></b><b></b><b></b></div>'
      + (full ? '<div class="done">Complete</div>' : '')
      + '<div class="lv" style="color:'+LCOL[lv]+'">'+lv+'</div>'
      + '<div class="nm">'+LNAME[lv]+' · '+dossiers(lv).length+' dossiers</div>'
      + '<div class="cnt">'+gg+' / '+ls.length+' lessons</div>'
      + '<div class="pbar"><i style="width:'+(100*gg/ls.length)+'%;background:'+LCOL[lv]+'"></i></div>'
      + '</div>';
  }).join('') + '</div>';
  document.querySelectorAll('.win').forEach(w=>w.onclick=()=>{ renderLevel(w.dataset.lv); show('v-level'); });
}
function renderLevel(lv){
  const ds = dossiers(lv), ls = byLv(lv);
  document.getElementById('v-level').innerHTML =
    '<button class="back" id="bk1">‹ All levels</button>'
    + '<div class="vtitle" style="color:'+LCOL[lv]+'">Level '+lv+'</div>'
    + '<div class="vsub">'+LNAME[lv]+' · '+got(ls)+' of '+ls.length+' lessons collected</div>'
    + ds.map((d,i)=>{
        const gg = got(d.ls), full = gg===d.ls.length;
        return '<div class="pack" data-d="'+i+'">'
          + '<div class="dot" style="background:'+LCOL[lv]+'">'+(i+1)+'</div>'
          + '<div class="inf"><div class="t">'+d.name+'</div>'
          + '<div class="c">'+gg+' / '+d.ls.length+' collected</div>'
          + '<div class="pbar"><i style="width:'+(100*gg/d.ls.length)+'%;background:'+LCOL[lv]+'"></i></div></div>'
          + (full ? '<div class="chk">✓</div>' : '<div class="chev">›</div>')
          + '</div>';
      }).join('');
  document.getElementById('bk1').onclick=()=>{ renderHome(); show('v-home'); };
  document.querySelectorAll('#v-level .pack').forEach(p=>p.onclick=()=>{ renderDos(lv, ds[+p.dataset.d]); show('v-dos'); });
}
function renderDos(lv, d){
  document.getElementById('v-dos').innerHTML =
    '<button class="back" id="bk2">‹ Level '+lv+'</button>'
    + '<div class="vtitle">'+d.name+'</div>'
    + '<div class="vsub">'+got(d.ls)+' of '+d.ls.length+' collected</div>'
    + '<div class="cards">' + d.ls.map(l=>{
        const cls = l.st===2 ? 'got' : (l.st===1 ? 'mid' : 'miss');
        const badge = l.st===2 ? '✓' : (l.st===1 ? 'In progress' : '·');
        const bord = l.st===1 ? 'border:3px solid '+LCOL[lv] : '';
        const tcol = l.st===2 ? 'border-top:6px solid '+LCOL[lv] : '';
        return '<div class="lcard '+cls+'" data-dir="'+l.dir+'" style="'+bord+tcol+'">'
          + '<div class="badge">'+badge+'</div>'
          + '<div class="lt">'+l.t+'</div><div class="lg">'+l.goal+'</div></div>';
      }).join('') + '</div>';
  document.getElementById('bk2').onclick=()=>{ renderLevel(lv); show('v-level'); };
  document.querySelectorAll('#v-dos .lcard').forEach(c=>c.onclick=()=>{ location.href='/'+c.dataset.dir+'/'; });
}
const q = document.getElementById('q');
q.addEventListener('input', ()=>{
  const s = q.value.trim().toLowerCase();
  if(!s){ show('v-home'); return; }
  const hits = DATA.filter(l => l.t.toLowerCase().includes(s) || l.dos.toLowerCase().includes(s) || l.goal.toLowerCase().includes(s) || l.lv.toLowerCase()===s);
  document.getElementById('v-search').innerHTML =
    '<div class="vtitle">Search</div><div class="vsub">'+hits.length+' result'+(hits.length===1?'':'s')+'</div>'
    + (hits.length ? hits.map(l=>
        '<div class="res" data-dir="'+l.dir+'"><div class="rl" style="background:'+LCOL[l.lv]+'">'+l.lv+'</div>'
        + '<div class="rt"><div class="a">'+l.t+'</div><div class="b">'+l.dos+' · '+l.goal+'</div></div>'
        + '<div class="st" style="color:'+(l.st===2 ? '#ffb020' : (l.st===1 ? '#7c5cff' : '#b3aed2'))+'">'+(l.st===2 ? '✓ Collected' : (l.st===1 ? 'In progress' : 'Not started'))+'</div></div>'
      ).join('') : '<div class="empty">Nothing matches that search yet.</div>');
  document.querySelectorAll('#v-search .res').forEach(r=>r.onclick=()=>{ location.href='/'+r.dataset.dir+'/'; });
  show('v-search');
});
renderHome();
</script>
</body>
</html>
