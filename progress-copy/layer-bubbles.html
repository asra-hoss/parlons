<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bubble Layer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:linear-gradient(180deg, #7d94b8 0%, #a8b8cc 45%, #d9c9a8 100%); overflow:hidden; font-family:system-ui, sans-serif; }
  #layer { position:absolute; inset:0; overflow:hidden; }
  .b { position:absolute; border-radius:50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0 6%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 72% 82%, rgba(255,110,215,.30), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 24% 78%, rgba(80,195,255,.32), rgba(255,255,255,0) 55%),
      radial-gradient(circle at 78% 30%, rgba(140,255,190,.20), rgba(255,255,255,0) 50%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.14), rgba(255,255,255,.03) 72%);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.55),
      inset -6px -9px 16px rgba(110,150,255,.35),
      inset 5px 7px 12px rgba(255,255,255,.35),
      0 6px 18px rgba(40,60,110,.18);
    animation:floaty ease-in-out infinite alternate; }
  @keyframes floaty { from { transform:translate(0, 12px); } to { transform:translate(10px, -16px); } }
</style>
</head>
<body>
<div id="layer"></div>
<script>
(function () {
  var layer = document.getElementById('layer');
  // [left%, top%, size px, float duration s]
  var B = [
    [8, 10, 64, 6.5], [26, 30, 120, 8], [55, 8, 44, 5.5], [74, 20, 88, 7],
    [86, 46, 54, 6], [14, 52, 96, 7.5], [40, 58, 60, 6.2], [64, 66, 130, 8.5],
    [84, 78, 72, 6.8], [30, 82, 40, 5.2], [52, 38, 34, 5.8], [6, 76, 48, 6.4]
  ];
  B.forEach(function (b, i) {
    var el = document.createElement('div');
    el.className = 'b';
    el.style.left = b[0] + '%'; el.style.top = b[1] + '%';
    el.style.width = b[2] + 'px'; el.style.height = b[2] + 'px';
    el.style.animationDuration = b[3] + 's';
    el.style.animationDelay = (-i * 0.9) + 's';
    layer.appendChild(el);
  });
})();
</script>
</body>
</html>
