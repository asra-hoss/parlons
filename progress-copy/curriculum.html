<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chichilang — Curriculum</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f6efe0; color:#2b2440; overflow-x:hidden; }
  header { position:relative; }
  header img { width:100%; height:170px; object-fit:cover; object-position:50% 20%; display:block; }
  header .t { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.55); }
  header h1 { margin:0; font-family:Georgia,serif; font-size:30px; }
  main { padding:14px 14px 30px; max-width:640px; margin:0 auto; }
  .tile { display:flex; align-items:center; border-radius:18px; padding:20px 22px; margin:12px 0; color:#fff; cursor:pointer; box-shadow:0 4px 12px rgba(60,45,10,.16); user-select:none; }
  .tile .code { font-family:Georgia,serif; font-size:38px; font-weight:700; }
  .tile .arr { margin-left:auto; font-size:26px; opacity:.85; }
  .panel { position:fixed; inset:0; background:#f6efe0; transform:translateX(102%); transition:transform .34s cubic-bezier(.32,.72,.28,1); z-index:10; display:flex; flex-direction:column; box-shadow:-8px 0 28px rgba(40,30,5,.25); }
  .panel.in { transform:translateX(0); }
  .panel .phead { display:flex; align-items:center; gap:12px; padding:16px; color:#fff; }
  .panel .back { background:rgba(255,255,255,.22); border:0; color:#fff; font-size:17px; font-weight:800; border-radius:999px; padding:8px 15px; cursor:pointer; }
  .panel .ptitle { font-family:Georgia,serif; font-size:25px; font-weight:700; }
  .panel .pbody { overflow-y:auto; padding:12px 14px 30px; -webkit-overflow-scrolling:touch; }
  .drow { display:flex; align-items:center; gap:11px; background:#fffdf7; border:1.5px solid #eadfc6; border-radius:14px; padding:15px 14px; margin:9px 0; cursor:pointer; user-select:none; }
  .drow .dn { color:#fff; border-radius:8px; font-size:13px; font-weight:800; padding:3px 9px; white-space:nowrap; }
  .drow .dt { font-size:16.5px; font-weight:700; color:#43355e; }
  .drow .arr { margin-left:auto; font-size:20px; color:#b39b57; }
  .lrow { display:flex; gap:10px; align-items:baseline; background:#fffdf7; border:1.5px solid #eadfc6; border-radius:12px; padding:12px 14px; margin:7px 0; font-size:15.5px; color:#37304d; }
  .lrow .n { flex:none; min-width:32px; height:22px; border-radius:999px; background:#f0e7d3; color:#7a6428; font-size:13px; font-weight:800; text-align:center; line-height:22px; padding:0 7px; }
</style></head><body>
<header><img src="scene2.jpg" alt=""><div class="t"><h1>Chichilang</h1></div></header>
<main id="main"></main>
<div class="panel" id="pLevel">
  <div class="phead" id="pLevelHead"><button class="back" id="pLevelBack">‹ Back</button><span class="ptitle" id="pLevelTitle"></span></div>
  <div class="pbody" id="pLevelBody"></div>
</div>
<div class="panel" id="pDos" style="z-index:20">
  <div class="phead" id="pDosHead"><button class="back" id="pDosBack">‹ Back</button><span class="ptitle" id="pDosTitle" style="font-size:20px"></span></div>
  <div class="pbody" id="pDosBody"></div>
</div>
<script>
var DATA = {"A1": {"Se présenter": [[1, "Bonjour !"], [2, "Je suis Asra"], [3, "Ça s'écrit comment ?"], [4, "J'ai vingt ans"], [5, "Je viens de Toronto"], [6, "Je suis étudiante"], [7, "Je remplis un formulaire"], [8, "Pourquoi j'apprends le français"]], "Les gens autour de moi": [[9, "Tu es d'où ?"], [10, "Voici mon ami"], [11, "Ma famille"], [12, "Il est comment ?"], [13, "On fait connaissance"]], "Ma journée": [[14, "Quelle heure est-il ?"], [15, "Ma journée"], [16, "Je sais, je dis, je vois"], [17, "J'ai mal"], [18, "Mes goûts et mes loisirs"], [19, "On sort ?"], [126, "Félicitations !"]], "Ma maison": [[20, "Ma maison"]], "Ma ville": [[21, "Ma ville"], [22, "Où est la poste ?"]], "Manger": [[23, "Au café"]], "Acheter": [[24, "Je fais les courses"]], "Vêtements": [[25, "J'achète un pull"]], "Voyages": [[26, "Je prends le train"], [27, "Je réserve un hôtel"]], "Météo": [[28, "Quel temps fait-il ?"]], "Raconter": [[29, "Hier, j'ai…"], [30, "Je suis allée à Paris"], [31, "Avant et maintenant"], [32, "Demain, je vais…"]], "Avis et bilan": [[33, "Un conseil, un avis"], [34, "Un film que j'aime"], [35, "Bilan A1"]]}, "A2": {"Moi et mon passé": [[36, "Ma personnalité, mes sentiments"], [37, "Quand j'étais petit"], [38, "Je raconte ma vie"]], "Démarches et vie pratique": [[39, "Les démarches"], [40, "La vie pratique"], [41, "J'écris un message"]], "Mon quartier": [[42, "Mon logement, mon quartier"], [127, "En haut, en bas, là-bas"]], "La nature": [[43, "La nature et les animaux"]], "Voyage": [[44, "Je prépare un voyage"]], "Sorties": [[45, "Culture et sorties"]], "Cuisine": [[46, "À la cuisine"]], "Achats": [[47, "Je consomme"], [128, "En bois, en verre, à café"]], "Santé": [[48, "Chez le médecin"]], "Sport": [[49, "Sport et sécurité"]], "Études": [[50, "Mes études"]], "Métiers": [[132, "Mon métier"]], "Technologie": [[51, "Les médias et la technologie"]], "Opinions et projets": [[52, "Mon opinion"], [53, "Mes projets"]]}, "B1": {"Projets": [[54, "Mes rêves et mes projets"]], "Études": [[55, "Étudier, se former"]], "Emploi": [[56, "Chercher un emploi"]], "Vivre à l'étranger": [[57, "Vivre à l'étranger"], [58, "L'administration"]], "Problèmes et urgences": [[59, "Les petits problèmes"], [60, "Les urgences et l'assurance"]], "Culture et sorties": [[61, "Cultures différentes"], [62, "On sort ensemble"], [63, "La culture"]], "Fêtes": [[64, "Fêtes et traditions"]], "Voisinage": [[65, "Habiter ensemble"]], "Consommer": [[66, "Consommer mieux"]], "Environnement": [[67, "Agir pour l'environnement"]], "La mode": [[129, "Tu portes quoi ?"]], "Médias": [[68, "Les médias"]], "Technologie": [[69, "Technologie et innovation"]], "Raconter et argumenter": [[70, "Je raconte une histoire"], [71, "Je donne mon avis"], [72, "Conseils et obligations"]], "Écrire, comprendre, bilan": [[73, "J'écris et je présente"], [74, "Je comprends le français réel"], [75, "Bilan B1"]]}, "B2": {"Argumenter et nuancer": [[76, "Argumenter"], [77, "Douter, souhaiter, regretter"], [78, "Cause et conséquence"], [79, "Rapporter des propos"]], "Société": [[80, "La société"]], "Climat": [[81, "Climat et environnement"]], "Politique": [[82, "La politique"]], "Histoire": [[83, "La langue et l'histoire"]], "Technologie": [[84, "Technologie et progrès"]], "Santé et sciences": [[85, "Santé et sciences"]], "Émotions": [[86, "Les relations et les émotions"]], "Expressions": [[87, "Expressions et registres"]], "Travail": [[88, "Au travail"]], "Écriture formelle": [[89, "Écrire de façon formelle"], [90, "Le style soutenu"]], "Tourisme": [[91, "Tourisme et voyage"]], "Arts": [[92, "Art et création"]], "Authentique et bilan": [[93, "Comprendre l'authentique"], [94, "Bilan B2"]], "La mode": [[95, "La mode"]], "L'éducation": [[96, "L'éducation"]], "Sport": [[97, "Le sport"]]}, "C1": {"La ville": [[98, "La ville"]], "L'alimentation": [[99, "L'alimentation"]], "Santé et éthique": [[100, "Santé, science et éthique"]], "Le corps et l'art": [[101, "Le corps et l'art"]], "Société": [[102, "Société, identité, générations"]], "Philosophie": [[103, "Philosophie et émotions"]], "Travail et économie": [[104, "Travail et économie"]], "Politique": [[105, "Politique et institutions"]], "Numérique": [[106, "L'ère numérique"]], "Écologie": [[107, "Écologie et énergie"]], "Histoire": [[108, "Histoire et mémoire"]], "Cultures": [[109, "L'interculturel"]], "Langue, discours, écriture": [[110, "Les registres de la langue"], [111, "Le discours structuré"], [112, "La grammaire avancée"], [113, "Écrire à un niveau avancé"], [130, "Les connecteurs formels"], [114, "Les négations"]]}, "C2": {"Résumer et nuancer": [[115, "Résumer et reformuler"], [116, "Les nuances"], [117, "Penser de façon critique"]], "Monde et textes": [[118, "Politique internationale"], [119, "Littérature et textes classiques"], [120, "Domaines spécialisés"]], "Style et oral": [[121, "Maîtriser le style"], [122, "Parler longuement"]], "Écrire, comprendre, bilan": [[123, "Écrire longuement"], [124, "Tout comprendre"], [125, "Bilan C2"]]}};
var COLORS = {A1:'#3f9e63', A2:'#2f9e8f', B1:'#3f7fbf', B2:'#7a5ff0', C1:'#b04a8a', C2:'#d9930d'};
var main = document.getElementById('main');
var pLevel = document.getElementById('pLevel'), pDos = document.getElementById('pDos');
Object.keys(DATA).forEach(function(lv){
  var tile = document.createElement('div'); tile.className = 'tile'; tile.style.background = COLORS[lv];
  tile.innerHTML = '<span class="code">' + lv + '</span><span class="arr">›</span>';
  tile.addEventListener('click', function(){ openLevel(lv); });
  main.appendChild(tile);
});
function openLevel(lv){
  document.getElementById('pLevelTitle').textContent = lv;
  document.getElementById('pLevelHead').style.background = COLORS[lv];
  var body = document.getElementById('pLevelBody'); body.innerHTML = '';
  Object.keys(DATA[lv]).forEach(function(dname, di){
    var row = document.createElement('div'); row.className = 'drow';
    row.innerHTML = '<span class="dn" style="background:' + COLORS[lv] + '">' + lv + '·' + (di+1) + '</span><span class="dt"></span><span class="arr">›</span>';
    row.querySelector('.dt').textContent = dname;
    row.addEventListener('click', function(){ openDos(lv, dname); });
    body.appendChild(row);
  });
  pLevel.classList.add('in');
}
function openDos(lv, dname){
  document.getElementById('pDosTitle').textContent = dname;
  document.getElementById('pDosHead').style.background = COLORS[lv];
  var body = document.getElementById('pDosBody'); body.innerHTML = '';
  DATA[lv][dname].forEach(function(L){
    var row = document.createElement('div'); row.className = 'lrow';
    row.innerHTML = '<span class="n">' + L[0] + '</span><span></span>';
    row.lastChild.textContent = L[1];
    body.appendChild(row);
  });
  pDos.classList.add('in');
}
document.getElementById('pLevelBack').addEventListener('click', function(){ pLevel.classList.remove('in'); });
document.getElementById('pDosBack').addEventListener('click', function(){ pDos.classList.remove('in'); });
window.__curr2 = { tiles: document.querySelectorAll('.tile').length };
</script>
</body></html>
