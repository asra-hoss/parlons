<style>
:root{--accent:#7a5ff0;--accent-deep:#5a3fd4;--accent-soft:#efeaff;--surface-alt:#f4f1fe;--text:#221d33;--border:#ece7fb}

@font-face{font-family:Vazirmatn;src:url(https://kamelon.app/assets/fonts/vazirmatn-regular.woff2) format('woff2');font-weight:400;font-display:swap}

*{box-sizing:border-box}
body{margin:0;font-family:Nunito,Vazirmatn,system-ui,sans-serif;color:var(--text);background:#fff}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid var(--border)}
.hd{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.wordmark{font-size:27px;font-weight:900;letter-spacing:-.5px}
.lvlpill{background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:3px 14px;font-size:15px}
.hdnote{margin-inline-start:auto;font-size:12.5px;color:#8a7bb8}
h1{font-size:24px;font-weight:900;margin:22px 0 4px}
.sub{color:#6f6590;font-size:14.5px;margin:0 0 14px;line-height:1.9}
.dcard{display:block;text-decoration:none;color:var(--text);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin:14px 0;box-shadow:0 10px 24px -18px rgba(90,63,212,.45)}
.banner{background:linear-gradient(135deg,#7a5ff0,#a78bfa);color:#fff;padding:20px;display:flex;align-items:center;gap:14px}
.bignum{font-size:44px;font-weight:900;line-height:1}
.banner .bt{font-size:20px;font-weight:800}
.dcard .bd{padding:14px 18px;font-size:14.5px;color:#6f6590;line-height:1.9}
.backpill{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);text-decoration:none;font-weight:800;border-radius:999px;padding:6px 16px;font-size:14px;margin-top:18px}
.goal{background:var(--accent-soft);border-radius:20px;padding:18px;margin:16px 0 8px}
.goal h2{margin:0 0 8px;font-size:18px;font-weight:900}
.pillbar{position:sticky;top:57px;background:#fff;z-index:9;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}
.pillbar::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;text-decoration:none;color:var(--text);border:1.5px solid #e6defc;border-radius:999px;padding:6px 15px;font-weight:700;font-size:14px;background:#fff}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
section{scroll-margin-top:120px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.sec-h .fr{font-size:21px;font-weight:900}
.sec-h .fa{color:#8a7bb8;font-size:14px;font-weight:700}
.item{border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:0 8px 20px -18px rgba(90,63,212,.5)}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700;margin-bottom:8px}
.item h3{margin:0 0 8px;font-size:17px;font-weight:800;line-height:1.7}
p.fa{margin:5px 0;line-height:2;font-size:15px}
p.fr{direction:ltr;text-align:left;margin:5px 0;line-height:1.55;font-size:16.5px}
.vocrow{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px dashed #f0ebfd}
.vocrow:last-child{border-bottom:none}
.frw{direction:ltr;font-weight:700;font-size:16px}
.eq{color:#b3a6e8}
.vocfa{color:#4c4368}
.audiocard{background:var(--surface-alt);border-radius:16px;padding:12px;margin:8px 0}
.audiocard audio{width:100%}
.noaudio{display:inline-block;border:1.5px dashed #c9bcf5;color:#8a7bb8;border-radius:10px;padding:4px 12px;font-size:13px;margin:6px 0}
.foot{color:#a294c9;font-size:12.5px;text-align:center;margin-top:40px;line-height:1.9}
</style>
</head>

    ${s.items.map(it=>`<div class="item"><span class="chip">${esc(it.step)}</span><h3>${esc(it.title)}</h3>
      ${it.audio?`<div class="audiocard"><audio controls preload="none" src="${it.audio}"></audio></div>`:''}
      ${it.listen_noaudio?`<span class="noaudio">فایل صوتی هنوز ساخته نشده</span>`:''}
      ${lines(it.lines)}</div>`).join('')}
  </section>`).join('');
  app.innerHTML = `<a class="backpill" href="#">→ Dossiers</a>
    <h1>Dossier ${d.n} — ${esc(d.name)}</h1>
    <div class="goal">${goal}</div>
    <div class="pillbar">${pills}</div>${secs}
    <p class="foot">Camelon — محتوای اصل، سطح A1</p>`;
}
function route(){
  const m = location.hash.match(/^#d([0-9])$/);
  if(m) dossier(DATA[+m[1]]); else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
</script>
</body>
</html>
