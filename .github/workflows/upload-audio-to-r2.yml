name: Upload audio to R2
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out site tree (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Upload all mp3 under site/assets to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: kamelon-audio
        run: python3 site/migration-tools/upload-audio-to-r2.py --source site --workers 16
